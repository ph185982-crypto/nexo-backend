      const mEst = mission ? (mission.estimated_mins || 0) : 0;
      const nextBlock = mBlocks.find(b => !b.is_completed);
      const nextType = nextBlock ? blockActionType(nextBlock) : null;
      const nextIdx = nextBlock ? mBlocks.indexOf(nextBlock) : -1;
      if (!missionDone && nextBlock && mTotal > 0) {
        return `<button class="mission-cta fade-in" onclick="startMissionBlock(${nextIdx},'${nextType}')">
          <span class="cta-label">${mDone > 0 ? 'Continuar missão' : 'Começar missão'}</span>
          <span class="cta-detail">${esc(nextBlock.title)} · ${mEst} min no total</span>
        </button>`;
      }
      return '';
    })()}

    ${!(mission && isRestDay) ? `<div class="mission-block fade-in">
      ${mission && mission.carried_over ? `<div class="carry-warn">${I.clock} <span>Missão anterior em aberto — ela continua sendo a de hoje. Conteúdo novo só depois que esta fechar.</span></div>` : ''}
      <div class="mission-header">
        <div>
          <div class="section-eyebrow">${mission ? (DAY_KIND_LABEL[mission.day_kind] || 'Missão do dia') : 'Missão do dia'}${mission && mission.topic_label ? ` · ${esc(mission.topic_label)}` : ''}</div>
          <div class="section-title">${missionDone ? 'Missão cumprida!' : mTotal > 0 ? `${mDone} de ${mTotal} etapas` : 'Carregando...'}</div>
        </div>
        ${mTotal > 0 ? `<div class="mission-ring">
          <svg viewBox="0 0 36 36" class="mission-svg">
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="ring-fill ${missionDone?'done':''}" stroke-dasharray="${mPct}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          </svg>
          <span class="ring-text">${mPct}%</span>
        </div>` : ''}
      </div>
      ${mission && mDone === 0 && !missionDone && !mission.carried_over ? `<button class="mission-regen-btn" onclick="regenerateMission()">Gerar nova missão de hoje</button>` : ''}
      ${!mission ? `<div class="mission-loading"><button class="btn btn-primary btn-full" onclick="loadMission()">Gerar plano de estudo</button></div>` :
      mBlocks.length ? `<div class="mission-tasks">${mBlocks.map((b, i) => missionTaskRow(b, i)).join('')}</div>` : `<div class="mission-empty"><p>Nenhuma etapa disponível</p></div>`}
      ${missionDone ? `<div class="mission-complete-banner"><span>Parabéns! Volte amanhã para a próxima missão.</span></div>` : ''}
    </div>` : ''}

    ${(() => {
      if (!mission || !mBlocks.length || !S.resources || !S.resources.length) return '';
      const sIds = [...new Set(mBlocks.map(b => b.subject_id).filter(Boolean))];
      const slugMap = {};
      (S.subjects || []).forEach(s => { slugMap[String(s.id)] = s.slug; });
      const slugs = sIds.map(id => slugMap[String(id)]).filter(Boolean);
      const related = { 'direito-penal': ['direito-penal-militar','criminologia'], 'direito-processual-penal': ['direito-processual-penal-militar'], 'direito-constitucional': ['legislacao-institucional-pm'], 'legislacao-especial': ['legislacao-institucional-pm'] };
      const expanded = new Set(slugs);
      slugs.forEach(s => { (related[s] || []).forEach(r => expanded.add(r)); });
      let allRes = S.resources.filter(r => expanded.has(r.subject_slug));
      if (!allRes.length) allRes = S.resources.slice(0, 6);
      // A videoaula do dia agora vive dentro da própria missão (bloco
      // video_lesson, do mesmo tópico do áudio e da lei seca). Aqui fica só o
      // material de apoio — repetir vídeo solto embaixo competia com a missão.
      const docs = allRes.filter(r => r.resource_type !== 'video');
      if (!docs.length) return '';
      return `<div class="mission-resources fade-in">
        <div class="section-eyebrow">Material complementar</div>
        <div class="section-title" style="margin-bottom:12px">Leis e artigos das matérias de hoje</div>
        ${docs.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener" class="resource-card" style="text-decoration:none;color:inherit">
          <div class="res-type-badge">${d.resource_type === 'pdf' ? I.book : I.search} ${d.resource_type === 'pdf' ? 'PDF' : 'Artigo'}</div>
          <div class="res-title">${esc(d.title)}</div>
          <div class="res-reason">${esc(d.reason)}</div>
          <div class="res-source">${esc(d.source)}</div>
        </a>`).join('')}
      </div>`;
    })()}

    <div class="approval-block">
      <div class="approval-head">
        <span class="lbl">Chance de aprovação</span>
        <span class="val">${apr}<span class="pct">%</span></span>
      </div>
      <div class="meter-track"><div class="meter-fill" style="width:${apr}%"></div></div>
      <div class="approval-foot">
        <span>Estimativa por desempenho</span>
        <span>${apr < 40 ? 'Continue estudando' : apr < 70 ? 'No caminho certo' : 'Excelente'}</span>
      </div>
    </div>
    ${(d.expected_lost_points||0) > 0 ? `<div class="risk-block">
      <div class="risk-head">
        <span class="lbl">Se a prova fosse hoje, você perderia</span>
        <span class="risk-val">${Math.round(d.expected_lost_points)}<span class="risk-unit"> de ${d.exam_total_items||50} pontos</span></span>
      </div>
      ${(d.top_risks||[]).length ? `<div class="risk-chips">
        ${d.top_risks.map(r => `<div class="risk-chip"><span class="rc-pts">${r.points_at_risk}pt</span><span class="rc-name">${esc(r.subject_name)}</span></div>`).join('')}
      </div>` : ''}
    </div>` : ''}
    ${(() => {
      const ad = S.approvalDetail;
      if (!ad || ad.target_cutoff == null) return '';
      const okCutoff = ad.gap_to_cutoff <= 0;
      return `<div class="risk-block">
        <div class="risk-head">
          <span class="lbl">Corte-alvo (${esc(S.studyProfile?.municipio || 'seu município')}: ${ad.target_cutoff}pt)</span>
          <span class="risk-val" style="color:${okCutoff ? 'var(--success,#2e9e5b)' : 'var(--error)'}">
            ${okCutoff ? 'Batendo' : `Faltam ${ad.gap_to_cutoff}`}<span class="risk-unit"> · projeta ${ad.projected_points}pt</span></span>
        </div>
      </div>`;
    })()}
    ${wp.length ? `<div class="week-block">
      <div class="section-eyebrow">Últimos 7 dias</div>
      <div class="section-title">Seu ritmo</div>
      <div class="week-chart">${wp.map(w => {
        const pct = Math.max(((w.study_minutes||0)/maxMin)*100, 4);
        const dow = new Date(w.date + 'T00:00').getDay();
        const isToday = dow === today;
        const cls = w.mission_completed ? 'done' : (isToday || w.study_minutes > 0) ? 'active' : '';
        return `<div class="week-col"><div class="week-bar ${cls}" style="height:${pct}%"></div><div class="week-day ${isToday?'today':''}">${SD[dow]}</div></div>`;
      }).join('')}</div>
    </div>` : ''}
    <div class="shortcuts-block">
      <div class="section-eyebrow">Atalhos rápidos</div>
      <div class="shortcut-list">
        ${due > 0 ? `<div class="shortcut" onclick="switchTab('more');openReviews()">
          <div class="badge-icon gold">${I.refresh}</div>
          <div class="info"><h3>Revisões pendentes</h3><p>Repetição espaçada</p></div>
          <span class="count-badge">${due}</span>
        </div>` : ''}
        <div class="shortcut" onclick="switchTab('simulado')">
          <div class="badge-icon accent">${I.target}</div>
          <div class="info"><h3>Simulado ${S.targetExam||'PMGO'}</h3><p>${(S.targetExam||'').startsWith('PM') ? 'Prova completa · 2 blocos' : 'Prova completa · 3 blocos'}</p></div>
          <div class="chev">${I.chev}</div>
        </div>
        <div class="shortcut" onclick="switchTab('practice')">
          <div class="badge-icon">${I.book}</div>
          <div class="info"><h3>Praticar por matéria</h3><p>${(S.targetExam||'').startsWith('PM') ? 'Questões A-E com tutor IA' : 'Questões C/E com tutor IA'}</p></div>
          <div class="chev">${I.chev}</div>
        </div>
        <div class="shortcut" onclick="switchTab('more');openTrilha()">
          <div class="badge-icon">${I.target}</div>
          <div class="info"><h3>Trilha do edital</h3><p>Mapa de cobertura</p></div>
          <div class="chev">${I.chev}</div>
        </div>
      </div>
    </div>
    ${renderCoverageHeatmap()}`;
}

// ===== PRACTICE =====
function viewPractice() {
  if (S.subView === 'tutor') return viewTutor();
  if (S.subView === 'questions') return viewPracticeQuestions();
  if (S.subView === 'resources') return viewResources();
  if (!S.subjects) return appbar() + skeletonBlock();
  const isPM = S.targetExam && S.targetExam.startsWith('PM');
  const wKey = isPM ? 'weight_pm' : 'weight_prf';
  const active = S.subjects.filter(s => s.is_active !== false && (s[wKey] || 0) > 0)
    .sort((a,b) => (b[wKey]||0) - (a[wKey]||0));
  const resMap = {};
  (S.resources || []).forEach(r => { resMap[r.subject_slug] = (resMap[r.subject_slug] || 0) + 1; });
  return `${appbar()}
    <div class="hero-block fade-in">
      <div class="section-eyebrow">Estudar · ${S.targetExam || 'PMGO'}</div>
      <div class="display-hero">Escolha uma <em>matéria</em></div>
      <div class="chip-row mt-12"><span class="level-chip">${active.length} disciplinas</span></div>
    </div>
    <div class="subject-list">${active.map(s => {
      const rc = resMap[s.slug] || 0;
      return `
      <div class="subject-item" onclick='selectSubject("${s.id}", ${attr(s.name)})'>
        <div class="subj-color" style="background:${esc(s.color) || 'var(--primary)'}"></div>
        <div class="subj-info">
          <div class="subj-name">${esc(s.name)}</div>
          <div class="subj-desc">${esc(s.description || '')}${rc ? ` · <span style="color:var(--primary)">${rc} recursos</span>` : ''}</div>
        </div>
        <div class="subj-weight">${s[wKey] || 0}×</div>
      </div>`;
    }).join('')}
    </div>`;
}

function viewPracticeQuestions() {
  if (S.loading.questions) {
    return `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button><span class="title-sub">Carregando</span></div>` + skeletonBlock(3, 90);
  }
  const q = S.questions[S.qIndex];
  if (!q) return `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button><span class="title-sub">${esc(S.selSubjectName)}</span></div>
    <div class="empty">${I.book}<h3>Sem questões</h3><p>Não encontramos questões para essa matéria.</p></div>`;

  const answered = S.answerResult !== null;
  const ar = S.answerResult;

  return `<div class="topbar-sub">
      <button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button>
      <span class="title-sub">${esc(S.selSubjectName)}</span>
      <span class="meta-sub">${S.qIndex + 1}/${S.questions.length}</span>
    </div>
    <div class="q-container fade-in">
      <div class="q-progress">${S.questions.map((_, i) => {
        let c = '';
        if (S.answered[i] === true) c = 'done';
        else if (S.answered[i] === false) c = 'wrong';
        else if (i === S.qIndex) c = 'current';
        return `<div class="q-progress-dot ${c}"></div>`;
      }).join('')}</div>
      ${q.source ? `<div class="q-source-tag">${esc(q.source)}${q.year ? ' · ' + q.year : ''}</div>` : ''}
      <div class="q-context">${esc(q.context_text || (q.question_type === 'multipla_escolha'
        ? `Sobre ${q.subject_name || 'o tema'}, assinale a alternativa correta.`
        : `Acerca de ${q.subject_name || 'o tema'}, julgue o item a seguir.`))}</div>
      <div class="q-text">${esc(q.text)}</div>
      <div class="q-choices">${q.alternatives.map(a => {
        let c = 'q-choice';
        if (answered) {
          if (a.id === ar.selected_alternative?.id && ar.is_correct) c += ' correct';
          else if (a.id === ar.selected_alternative?.id && !ar.is_correct) c += ' wrong';
          else if (a.id === ar.correct_alternative?.id) c += ' correct-highlight';
        }
        return `<button class="${c}" ${answered?'disabled':''} onclick="answerQuestion('${q.id}','${a.id}')">
          <span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`;
      }).join('')}</div>
      ${answered ? `
        <div class="q-feedback ${ar.is_correct ? 'correct' : 'wrong'}">
          <div class="fb-title">${ar.is_correct ? 'Correto' : 'Incorreto'}</div>
          ${ar.explanation ? `<div class="fb-body">${esc(ar.explanation)}</div>` : ''}
          ${ar.legal_basis ? `<div class="fb-legal"><strong>Base legal:</strong> ${esc(ar.legal_basis)}</div>` : ''}
          ${ar.xp_earned ? `<div class="fb-xp">+${ar.xp_earned} XP</div>` : ''}
        </div>
        ${!ar.is_correct ? `<button class="btn btn-outline btn-full mt-16" onclick="startTutor('${q.id}')">
          ${I.brain} Entender com o tutor de IA</button>` : ''}
        <button class="btn btn-primary btn-full btn-lg mt-12" onclick="nextQuestion()">
          ${S.qIndex < S.questions.length - 1 ? 'Próxima questão' : 'Voltar às matérias'}</button>
      ` : ''}
      ${_subjectHasResources() ? `<div class="res-link mt-16" onclick="openResources()">
        ${I.book} Material complementar (${_subjectResourceCount()} recursos)</div>` : ''}
    </div>`;
}
function _subjectSlugForSelected() {
  if (!S.selSubject || !S.subjects) return '';
  const s = S.subjects.find(x => x.id === S.selSubject);
  return s ? s.slug : '';
}
function _subjectHasResources() {
  const slug = _subjectSlugForSelected();
  return slug && (S.resources || []).some(r => r.subject_slug === slug);
}
function _subjectResourceCount() {
  const slug = _subjectSlugForSelected();
  return (S.resources || []).filter(r => r.subject_slug === slug).length;
}
function openResources() {
  S._prevSubView = S.subView;
  S.subView = 'resources'; render(); scrollTop();
}
function backFromResources() {
  S.subView = S._prevSubView || 'questions'; S._prevSubView = null; render(); scrollTop();
}
function viewResources() {
  const slug = _subjectSlugForSelected();
  const items = (S.resources || []).filter(r => r.subject_slug === slug);
  const vids = items.filter(r => r.resource_type === 'video');
  const docs = items.filter(r => r.resource_type !== 'video');
  return `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="backFromResources()">${I.back}</button>
    <span class="title-sub">Material · ${esc(S.selSubjectName)}</span></div>
    <div class="fade-in">
      <div class="hero-block">
        <div class="section-eyebrow">Material Complementar</div>
        <div class="display-hero" style="font-size:20px">Vídeos, PDFs e artigos <em>curados</em></div>
        <p class="mt-8" style="color:var(--muted);font-size:13px">Assista direto aqui ou abra PDFs e artigos externos</p>
      </div>
      ${vids.map(r => {
        const ytId = _ytId(r.url);
        if (ytId) return `<div class="yt-embed-card">
          <div class="yt-frame-wrap"><iframe src="${_ytEmbedUrl(ytId)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
          <div class="yt-info">
            <div class="vid-title">${esc(r.title)}</div>
            <div class="vid-meta">${esc(r.reason)}</div>
          </div>
        </div>`;
        return `<a href="${esc(r.url)}" target="_blank" rel="noopener" class="resource-card" style="text-decoration:none;color:inherit">
          <div class="res-type-badge">${I.play} Vídeo</div>
          <div class="res-title">${esc(r.title)}</div>
          <div class="res-reason">${esc(r.reason)}</div>
          <div class="res-source">${esc(r.source)}</div>
        </a>`;
      }).join('')}
      ${docs.map(r => `
        <a href="${esc(r.url)}" target="_blank" rel="noopener" class="resource-card" style="text-decoration:none;color:inherit">
          <div class="res-type-badge">${r.resource_type === 'pdf' ? I.book + ' PDF' : I.search + ' Artigo'}</div>
          <div class="res-title">${esc(r.title)}</div>
          <div class="res-reason">${esc(r.reason)}</div>
          <div class="res-source">${esc(r.source)}</div>
        </a>`).join('')}
    </div>`;
}

// ===== SIMULADO =====
function viewSimulado() {
  if (S.simResult) return viewSimuladoResult();
  if (S.sim) return viewSimuladoExam();
  const isPM = S.targetExam && S.targetExam.startsWith('PM');
  const banca = isPM ? 'Instituto AOCP' : 'CEBRASPE';
  const totalItens = isPM ? 50 : 120;
  const tempo = isPM ? '4h' : '4h30';
  const correcao = isPM ? '+1 ou +2 · 0' : '+1 · −1 · 0';
  const blocos = isPM ? [
    { name:'Conhec. Gerais', count:'15 questões', desc:'Português (10) · Realidade de Goiás (5) — Peso 1' },
    { name:'Conhec. Específicos', count:'35 questões', desc:'Dir. Constitucional, Penal, Proc. Penal, Administrativo, Penal Militar, Proc. Penal Militar, Leg. Extravagante — Peso 2' },
  ] : [
    { name:'Bloco I', count:'55 itens', desc:'Português, RLM, Informática, Física, Ética, Geopolítica, Espanhol' },
    { name:'Bloco II', count:'30 itens', desc:'Legislação de Trânsito' },
    { name:'Bloco III', count:'35 itens', desc:'Dir. Administrativo, Constitucional, Penal, Proc. Penal, Leg. Especial, Dir. Humanos' },
  ];
  const formatDesc = isPM
    ? `${totalItens} questões de múltipla escolha (A a E), dois blocos com pesos diferenciados. Nota mínima: 60%.`
    : `${totalItens} itens Certo ou Errado, três blocos, correção oficial. Você é eliminado se a nota de qualquer bloco ficar negativa.`;
  return `${appbar()}
    <div class="sim-intro fade-in">
      <div class="section-eyebrow">Simulado ${S.targetExam || 'PMGO'} · ${banca}</div>
      <div class="sim-headline">Prova completa,<br><em>como no dia D</em>.</div>
      <div class="sim-desc">${formatDesc}</div>
      <div class="sim-spec">
        <div class="sim-spec-row"><span class="lbl">${I.layers}Total</span><span class="val">${totalItens} ${isPM ? 'questões' : 'itens'}</span></div>
        <div class="sim-spec-row"><span class="lbl">${I.timer}Tempo</span><span class="val">${tempo}</span></div>
        <div class="sim-spec-row"><span class="lbl">${I.target}Correção</span><span class="val">${correcao}</span></div>
      </div>
      <div class="section-eyebrow">Distribuição por bloco</div>
      <div class="sim-blocks-preview mt-12">
        ${blocos.map(b => `<div class="sim-block-preview"><div class="bl-head"><span class="bl-name">${b.name}</span><span class="bl-count">${b.count}</span></div>
          <div class="bl-desc">${b.desc}</div></div>`).join('')}
      </div>
      <button class="btn btn-primary btn-lg btn-full mt-24" onclick="generateSimulado()" ${S.loading.sim?'disabled':''}>
        ${S.loading.sim ? 'Gerando prova...' : 'Iniciar simulado'}</button>
    </div>`;
}

function viewSimuladoExam() {
  const b = S.simBlock;
  const qs = S.simQuestions[b] || [];
  const idx = S.simIndex[b] || 0;
  const q = qs[idx];
  const total = Object.keys(S.simAnswers).length;
  const isPM = S.targetExam && S.targetExam.startsWith('PM');
  const blockNums = isPM ? [1, 2] : [1, 2, 3];
  const totalQ = blockNums.reduce((s, n) => s + (S.simQuestions[n]||[]).length, 0);
  const blockLabels = isPM
    ? { 1: 'Gerais', 2: 'Específicos' }
    : { 1: 'Bloco I', 2: 'Bloco II', 3: 'Bloco III' };
  return `<div class="sim-header">
      <button class="sim-close" onclick="confirmExitSim()" aria-label="Sair do simulado">${I.close}</button>
      <div class="sim-timer ${S.simSeconds < 600 ? 'danger' : ''}">${I.clock}<span>${fmtTime(S.simSeconds)}</span></div>
      <div class="sim-count">${total}/${totalQ}</div>
    </div>
    <div class="segmented">${blockNums.map(n => {
      const bq = S.simQuestions[n] || [];
      const ans = bq.filter(x => S.simAnswers[x.id]).length;
      return `<button class="segmented-item ${b===n?'active':''}" onclick="switchSimBlock(${n})">
        <span>${blockLabels[n]}</span><span class="seg-count">${ans}/${bq.length}</span></button>`;
    }).join('')}</div>
    ${q ? `<div class="sim-q-nav">
      <button class="btn btn-ghost btn-sm" onclick="prevSimQ()" ${idx===0?'disabled':''}>${I.back}</button>
      <span class="sim-q-idx">${idx+1} / ${qs.length}</span>
      <button class="btn btn-ghost btn-sm" onclick="nextSimQ()" ${idx>=qs.length-1?'disabled':''}>${I.chev}</button>
    </div>
    <div class="q-container fade-in" style="padding-top:0">
      ${q.context_text ? `<div class="q-context">${esc(q.context_text)}</div>` : ''}
      <div class="q-text">${esc(q.text)}</div>
      <div class="q-choices">${(q.alternatives && q.alternatives.length > 2
        ? q.alternatives.map(a => `
          <button class="q-choice ${S.simAnswers[q.id]===a.letter?'correct':''}" onclick="answerSimQ('${q.id}','${a.letter}')">
            <span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`)
        : [{l:'C',t:'Certo'},{l:'E',t:'Errado'}].map(o => `
          <button class="q-choice ${S.simAnswers[q.id]===o.l?'correct':''}" onclick="answerSimQ('${q.id}','${o.l}')">

// ===== MISSION LEGAL READER =====
// Monta o texto do artigo com as expressões-chave viradas em lacuna.
// Os highlights foram gerados como "as expressões que a banca troca para
// tornar o item errado", então apagar justamente essas palavras transforma
// a leitura passiva em recuperação do que decide a questão.
function buildCloze(text, highlights) {
  const src = text || '';
  const low = src.toLowerCase();
  const marcas = [];
  // Do mais longo para o mais curto: evita que um highlight curto consuma
  // um pedaço de outro maior e quebre as duas lacunas.
  const cands = (highlights || [])
    .map(h => (h || '').trim())
    .filter(h => h.length >= 3)
    .sort((x, y) => y.length - x.length);

  for (const h of cands) {
    const at = low.indexOf(h.toLowerCase());
    if (at < 0) continue;                        // paráfrase, não casa literal
    if (marcas.some(m => at < m.fim && at + h.length > m.ini)) continue;  // sobreposição
    marcas.push({ ini: at, fim: at + h.length, texto: src.slice(at, at + h.length) });
  }
  marcas.sort((a, b) => a.ini - b.ini);

  const partes = [];
  let cur = 0;
  marcas.forEach((m, i) => {
    if (m.ini > cur) partes.push({ tipo: 'texto', valor: src.slice(cur, m.ini) });
    partes.push({ tipo: 'lacuna', valor: m.texto, idx: i });
    cur = m.fim;
  });
  if (cur < src.length) partes.push({ tipo: 'texto', valor: src.slice(cur) });
  return { partes, total: marcas.length };
}

function lfCloze() {
  const a = S.missionLegalArticles?.[S.missionLegalIdx];
  if (!a) return { partes: [], total: 0 };
  return buildCloze(a.official_text, a.highlights);
}

function revealBlank(i) {
  if (!S.lfRevealed.includes(i)) S.lfRevealed = S.lfRevealed.concat([i]);
  render();
}
function revealAllBlanks() {
  S.lfRevealed = lfCloze().partes.filter(p => p.tipo === 'lacuna').map(p => p.idx);
  render();
}
function lfGoStep(step) {
  S.lfStep = step;
  if (step === 'lacuna') S.lfRevealed = [];
  render(); scrollTop();
}

function viewMissionLegalReader() {
  const articles = S.missionLegalArticles;
  const idx = S.missionLegalIdx || 0;
  const block = S.mission?.blocks?.[S.activeMissionIdx];
  const head = `<div class="topbar-sub">
    <button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button>
    <span class="title-sub">${esc(block?.subject_name || 'Lei seca')}</span>
    ${articles && articles.length > 1 ? `<span class="meta-sub">${idx+1}/${articles.length}</span>` : ''}
  </div>`;
  if (!articles) return head + skeletonBlock(3, 90);
  if (!articles.length) return head + `<div class="empty">${I.scale}<h3>Sem artigos</h3><p>Nenhum artigo encontrado para esse bloco.</p></div>`;

  const a = articles[idx];
  const isLast = idx >= articles.length - 1;
  const cloze = lfCloze();
  // Com menos de duas lacunas o passo de recuperação não tem o que treinar.
  const temLacuna = cloze.total >= 2;
  // S.lfStep é a fonte da verdade; só cai pra 'explicar' se o artigo não tem
  // lacuna suficiente para o passo 'lacuna' que o usuário tentou abrir.
  const step = (!temLacuna && S.lfStep === 'lacuna') ? 'explicar' : (S.lfStep || 'ler');
  const revelados = S.lfRevealed.length;
  const faltam = cloze.total - revelados;

  const passos = temLacuna
    ? [['ler','Ler'], ['lacuna','Completar'], ['explicar','Entender']]
    : [['ler','Ler'], ['explicar','Entender']];
  const stepper = `<div class="lf-steps">${passos.map(([k, label], i) => {
    const atual = k === step;
    const feito = passos.findIndex(p => p[0] === step) > i;
    return `<div class="lf-step ${atual?'on':''} ${feito?'done':''}">
      <span class="lf-step-dot">${feito ? '&#10003;' : i+1}</span><span>${label}</span></div>`;
  }).join('<div class="lf-step-line"></div>')}</div>`;

  const barra = `<div class="lf-progress"><div class="lf-progress-fill" style="width:${((idx)/articles.length)*100}%"></div></div>`;

  let corpo = '';
  let acao = '';

  if (step === 'ler') {
    // Leitura com as expressões que a banca troca já marcadas: o olho passa
    // por elas sabendo que são elas que decidem a questão.
    corpo = `
      <div class="lf-official-label">Texto oficial</div>
      <div class="lf-official">${cloze.partes.map(p =>
        p.tipo === 'lacuna' ? `<mark class="lf-key">${esc(p.valor)}</mark>` : esc(p.valor)
      ).join('')}</div>
      ${temLacuna ? `<div class="lf-hint">As expressões marcadas são as que a banca troca para tornar o item errado.</div>` : ''}`;
    acao = temLacuna
      ? `<button class="btn btn-primary btn-full btn-lg mt-24" onclick="lfGoStep('lacuna')">Agora sem as palavras-chave</button>`
      : `<button class="btn btn-primary btn-full btn-lg mt-24" onclick="lfGoStep('explicar')">Entender o artigo</button>`;

  } else if (step === 'lacuna') {
    corpo = `
      <div class="lf-official-label">Complete de cabeça — toque para conferir</div>
      <div class="lf-official">${cloze.partes.map(p => {
        if (p.tipo !== 'lacuna') return esc(p.valor);
        const on = S.lfRevealed.includes(p.idx);
        const w = Math.max(3, Math.min(p.valor.length, 22));
        return on
          ? `<span class="lf-blank on">${esc(p.valor)}</span>`
          : `<button class="lf-blank" style="min-width:${w*0.62}em" onclick="revealBlank(${p.idx})">?</button>`;
      }).join('')}</div>
      <div class="lf-counter">${revelados} de ${cloze.total} conferidos${faltam ? '' : ' — todas!'}</div>`;
    acao = faltam
      ? `<button class="btn btn-outline btn-full mt-16" onclick="revealAllBlanks()">Revelar todas</button>`
      : `<button class="btn btn-primary btn-full btn-lg mt-16" onclick="lfGoStep('explicar')">Entender o artigo</button>`;

  } else {
    corpo = `
      ${a.simple_text ? `
        <div class="lf-simple-label">Entendendo o artigo</div>
        <div class="lf-simple">${esc(a.simple_text)}</div>` : ''}
      ${a.highlights?.length ? `
        <div class="lf-highlights-label">O que a banca troca</div>
        <div class="lf-highlights">${a.highlights.map(h => `<div class="lf-hl">${esc(h)}</div>`).join('')}</div>` : ''}
      <div class="lf-official-label">Texto oficial</div>
      <div class="lf-official lf-muted">${esc(a.official_text || '')}</div>`;
    acao = `<button class="btn btn-primary btn-full btn-lg mt-24" onclick="${isLast ? 'concludeLegalReading()' : 'nextLegalArticle()'}">
      ${isLast ? 'Concluir leitura' : 'Próximo artigo'}</button>`;
  }

  return head + barra + `<div class="legal-focus fade-in">
    <div class="lf-header">
      <div class="lf-doc">${esc(a.document_name || '')}</div>
      <div class="lf-art">Art. ${esc((a.article_number || '').replace(/^art\.?\s*/i, ''))}</div>
      ${a.title ? `<div class="lf-title">${esc(a.title)}</div>` : ''}
    </div>
    ${stepper}
    ${corpo}
    ${acao}
  </div>`;
}

  if (!ep) return head + `<div class="empty">${I.headphones}<h3>Episódio indisponível</h3></div>`;

  const total = ep.segment_count || 1;
  const parte = (S.podSeq || 0) + 1;
  const pct = S.audioDur > 0 ? (S.audioPos / S.audioDur) * 100 : 0;
  const tocando = S.audioPlaying;

  return head + `<div class="pn-wrap fade-in">
    <div class="pn-art">${I.headphones}</div>
    <div class="pn-title">${esc(ep.title || '')}</div>
    ${ep.description ? `<div class="pn-desc">${esc(ep.description)}</div>` : ''}

      <span class="level-chip">${Math.round((ep.duration_secs||0)/60)} min</span>
      <span class="level-chip">Parte ${parte} de ${total}</span>
    </div>

    ${carregando ? `<div class="pn-loading">
      <div class="pn-spin"></div>
      <div>Preparando o áudio do episódio...</div>
      <div class="pn-loading-sub">A primeira vez leva alguns segundos. Depois toca sem pausas.</div>
    </div>` : `
      <div class="pn-controls">
        <button class="pn-btn ${parte > 1 ? '' : 'ghost'}" onclick="podPrev()" ${parte>1?'':'disabled'}>${I.back}</button>
        <button class="pn-play" onclick="togglePlayPause()" aria-label="${tocando ? 'Pausar' : 'Tocar'}">${tocando ? I.pause : I.play}</button>
        <button class="pn-btn ${parte < total ? '' : 'ghost'}" onclick="podNext()" ${parte<total?'':'disabled'}>${I.chev}</button>
      </div>
      <div class="pn-track-row">
        <span class="pn-time">${fmtTime(S.audioPos)}</span>
        <div class="pn-track" onclick="seekAudio(event)"><div class="pn-fill" style="width:${pct}%"></div></div>
        <span class="pn-time">${fmtTime(S.audioDur)}</span>
      </div>

// ===== FLASHCARDS =====
function viewFlashcards() {
  const cards = S.fcCards;
  const i = S.fcIdx || 0;
  const head = `<div class="topbar-sub">
    <button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button>
    <span class="title-sub">Flashcards</span>
    ${cards?.length ? `<span class="meta-sub">${Math.min(i+1, cards.length)}/${cards.length}</span>` : ''}
  </div>`;
  if (!cards) return head + skeletonBlock(2, 140);
  if (!cards.length) return head + `<div class="empty">${I.brain}<h3>Sem cartões</h3><p>Nenhum flashcard para esse bloco.</p></div>`;

  const c = cards[i];
  if (!c) return head + `<div class="empty">${I.brain}<h3>Sessão concluída</h3>
    <p>Você revisou todos os cartões.</p>
    <button class="btn btn-primary mt-16" onclick="concludeFlashcards()">Concluir etapa</button></div>`;

  const QUALS = [
    {q:'wrong', label:'Não lembrei', cls:'q-wrong'},
    {q:'hard',  label:'Difícil',     cls:'q-hard'},
    {q:'good',  label:'Lembrei',     cls:'q-easy'},
  ];
  const virado = S.fcFlipped;

  return head + `<div class="fc-wrap fade-in">
    <div class="fc-progress"><div class="fc-progress-fill" style="width:${(i/cards.length)*100}%"></div></div>
    <div class="fc-card ${virado?'flipped':''}" onclick="${virado?'':'flipFlashcard()'}">
      <div class="fc-face">
        <div class="fc-label">${virado ? 'Resposta' : 'Complete de cabeça'}</div>
        <div class="fc-content">${esc(virado ? c.back : c.front)}</div>
        ${virado ? '' : '<div class="fc-tap">Toque para ver a resposta</div>'}
      </div>
    </div>
    ${virado ? `
      <div class="section-eyebrow" style="padding:16px 20px 8px">Como foi lembrar?</div>
      <div class="quality-grid-3">
        ${QUALS.map(x => `<button class="quality-btn-3 ${x.cls}" onclick="answerFlashcard('${c.id}','${x.q}')">
          <span class="qb3-label">${x.label}</span></button>`).join('')}
      </div>` : ''}
  </div>`;
}

function flipFlashcard() { S.fcFlipped = true; render(); }

async function answerFlashcard(cardId, quality) {
  try {
    const r = await api(`/api/prf/reviews/flashcards/${cardId}/answer?quality=${quality}`, { method:'POST' });
    if (r?.xp_earned) toast(`+${r.xp_earned} XP`, 'xp');
  } catch (e) {}
  S.fcIdx = (S.fcIdx || 0) + 1;
  S.fcFlipped = false;
  if (S.fcIdx >= (S.fcCards?.length || 0)) { await concludeFlashcards(); return; }
  render(); scrollTop();
}

async function openMissionFlashcards(blockIdx) {
  const b = S.mission?.blocks?.[blockIdx];
  if (!b) return;
  S.activeMissionIdx = blockIdx;
  S.missionBlockId = b.id;
  S.fcCards = null; S.fcIdx = 0; S.fcFlipped = false;
  S.subView = 'flashcards'; S.tab = 'more';
  render();
  const ids = (b.content_ids || []).join(',');
  if (!ids) { await finishMissionBlock(); return; }
  try {
    const d = await api(`/api/prf/reviews/flashcards/study?ids=${encodeURIComponent(ids)}`);
    S.fcCards = d.cards || [];
  } catch (e) { S.fcCards = []; }
  if (!S.fcCards.length) { await finishMissionBlock(); return; }
  render(); scrollTop();
}

async function concludeFlashcards() {
  await finishMissionBlock();
}

// ===== MISSION REVIEW =====
function viewMissionReview() {
  const reviews = S.reviews;
  const idx = S.reviewIdx || 0;
  const head = `<div class="topbar-sub">
    <button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button>
    <span class="title-sub">Revisão</span>
    ${reviews?.length ? `<span class="meta-sub">${idx+1}/${reviews.length}</span>` : ''}
  </div>`;
  if (!reviews) return head + skeletonBlock(2, 120);
  if (!reviews.length) return head + `<div class="empty">${I.refresh}<h3>Sem revisões</h3><p>Nenhuma revisão pendente no momento.</p></div>`;
  const card = reviews[idx];
  if (!card) return head + `<div class="empty">${I.refresh}<h3>Concluído</h3><p>Todas as revisões feitas.</p></div>`;
  const q = S.reviewQuestion;
  const ar = S.reviewAnswered;
  const answered = ar !== null && ar !== undefined;
  const QUALS = [
    {q:'wrong', label:'Errei', hint:'Respondi errado', cls:'q-wrong'},
    {q:'hard',  label:'Difícil', hint:'Acertei com esforço', cls:'q-hard'},
    {q:'easy',  label:'Bom', hint:'Lembrei bem', cls:'q-easy'},
  ];
  if (!q) {
    // Fallback: sem dados completos da questão
    return head + `<div class="q-container fade-in">
      <div class="review-card">
        <div class="rc-subject">${esc(card.subject_name || 'Revisão')}</div>
        <div class="rc-content">${esc(card.content_preview || '')}</div>
        <div class="rc-meta">Intervalo ${Math.round(card.interval_days||0)}d · ${card.repetitions||0} repetições</div>
      </div>
      <div class="section-eyebrow" style="padding:12px 20px 8px">Como foi lembrar?</div>
      <div class="quality-grid-3">
        ${QUALS.map(x => `<button class="quality-btn-3 ${x.cls}" onclick="submitMissionReview('${card.id}','${x.q}')">
          <span class="qb3-label">${x.label}</span><span class="qb3-hint">${x.hint}</span></button>`).join('')}
      </div>
    </div>`;
  }
  return head + `<div class="q-container fade-in">
    <div class="q-context">Revisão · ${esc(q.subject_name || card.subject_name || '')}</div>
    <div class="q-text">${esc(q.text)}</div>
    <div class="q-choices">${(q.alternatives||[]).map(a => {
      let cls = 'q-choice';
      if (answered) {
        if (a.id === ar?.selected_alternative?.id && ar.is_correct) cls += ' correct';
        else if (a.id === ar?.selected_alternative?.id && !ar.is_correct) cls += ' wrong';
        else if (a.id === ar?.correct_alternative?.id) cls += ' correct-highlight';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="answerMissionReview('${q.id}','${a.id}')">
        <span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`;
    }).join('')}</div>
    ${answered ? `
      <div class="q-feedback ${ar.is_correct ? 'correct' : 'wrong'}">
        <div class="fb-title">${ar.is_correct ? 'Correto' : 'Incorreto'}</div>
        ${ar.explanation ? `<div class="fb-body">${esc(ar.explanation)}</div>` : ''}
        ${ar.legal_basis ? `<div class="fb-legal"><strong>Base:</strong> ${esc(ar.legal_basis)}</div>` : ''}
      </div>
      <div class="section-eyebrow" style="padding:12px 20px 8px">Como foi?</div>
      <div class="quality-grid-3">
        ${QUALS.map(x => `<button class="quality-btn-3 ${x.cls}" onclick="submitMissionReview('${card.id}','${x.q}')">
          <span class="qb3-label">${x.label}</span><span class="qb3-hint">${x.hint}</span></button>`).join('')}
      </div>
    ` : ''}
  </div>`;
}

  const rows = banca === 'AOCP' ? `
        <div class="row"><span class="lbl">Banca</span><span class="val">AOCP (estimativa)</span></div>

        <div class="row"><span class="lbl"><strong>Nota final</strong></span><span class="val" style="color:${color}"><strong>${score.toFixed(1)}</strong></span></div>`
    : `
        <div class="row"><span class="lbl">Nota de conteúdo (NC)</span><span class="val">${(r.nc_score||0).toFixed(1)}</span></div>
        <div class="row"><span class="lbl">Erros microestruturais (NE)</span><span class="val">${r.ne_count||0}</span></div>
        <div class="row"><span class="lbl">Total de linhas (TL)</span><span class="val">${r.total_lines||0}</span></div>

        <div class="row"><span class="lbl"><strong>Nota final</strong></span><span class="val" style="color:${color}"><strong>${score.toFixed(1)}</strong></span></div>`;
  return `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="resetEssay()">${I.back}</button><span class="title-sub">Correção</span></div>

              <span style="font-size:12.5px;color:var(--ink-3)">${esc(it.description)}</span></span>

// ===== TRAJETÓRIA =====
// Calendário do candidato: o passado com visto (veio de daily_missions, é
// fato) e o futuro projetado (a fila de tópicos que a missão vai consumir).
// O tipo do dia — conteúdo, simulado no sábado, revisão no domingo — é fixo e
// não depende de projeção nenhuma.
const PLANO_STATUS = {
  done:    { label: 'Concluída',  cls: 'pl-done' },
  partial: { label: 'Incompleta', cls: 'pl-partial' },
  missed:  { label: 'Não feita',  cls: 'pl-missed' },
  today:   { label: 'Hoje',       cls: 'pl-today' },
  future:  { label: '',           cls: 'pl-future' },
};

function viewPlano() {
  const p = S.plano;
  const head = `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button><span class="title-sub">Minha trajetória</span></div>`;
  if (!p) return head + skeletonBlock(6, 60);

  const s = p.summary || {};
  // Dias anteriores ao primeiro uso do app não entram: nunca houve missão
  // ali para ser perdida.
  const dias = (p.days || []).filter(d => d.status !== 'before_start');
  const passados = dias.filter(d => d.is_past);
  const futuros = dias.filter(d => !d.is_past);
  const mostrarPassado = S.planoHistorico;
  const visiveis = mostrarPassado ? dias : futuros;

  const grupos = {};
  visiveis.forEach(d => {
    const dt = new Date(d.date + 'T12:00:00');
    const chave = dt.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    (grupos[chave] = grupos[chave] || []).push(d);
  });

  return head + `
    <div class="settings-section fade-in">
      <div class="section-eyebrow">${p.exam_date ? `Prova em ${new Date(p.exam_date + 'T12:00:00').toLocaleDateString('pt-BR')}` : 'Sem data de prova definida'}</div>
      <div class="section-title">${p.days_until_exam != null ? `Faltam ${p.days_until_exam} dias` : `Próximos ${s.horizon_days || 90} dias`}</div>
      <div class="plano-stats">
        <div class="pl-stat"><span class="pl-num">${s.missions_done || 0}</span><span class="pl-lbl">missões fechadas</span></div>
        <div class="pl-stat"><span class="pl-num">${s.missions_missed || 0}</span><span class="pl-lbl">não feitas</span></div>
        <div class="pl-stat"><span class="pl-num">${s.simulados_ahead || 0}</span><span class="pl-lbl">simulados pela frente</span></div>
        <div class="pl-stat"><span class="pl-num">${s.topics_remaining || 0}</span><span class="pl-lbl">tópicos a cobrir</span></div>
      </div>
      <p style="font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:12px">
        Sábado é simulado e domingo é revisão — isso é fixo. A matéria de cada dia de
        conteúdo é a fila atual: se você errar muito em uma matéria, ela sobe e o resto
        desce.
      </p>
      ${passados.length ? `<button class="btn btn-ghost btn-full" style="margin-top:10px" onclick="togglePlanoHistorico()">
        ${mostrarPassado ? 'Ocultar dias anteriores' : `Mostrar os ${passados.length} dias anteriores`}
      </button>` : ''}
    </div>
    ${Object.keys(grupos).map(mes => `<div class="settings-section fade-in" style="padding-top:0">
      <div class="section-eyebrow">${esc(mes)}</div>
      <div class="plano-list">
        ${grupos[mes].map(d => planoRow(d)).join('')}
      </div>
    </div>`).join('')}`;
}

function planoRow(d) {
  const st = PLANO_STATUS[d.status] || PLANO_STATUS.future;
  const dt = new Date(d.date + 'T12:00:00');
  const dia = dt.getDate();
  const semana = WEEKDAY_SHORT[d.weekday];
  const kindIcon = d.kind === 'simulado' ? I.timer : d.kind === 'revisao' ? I.refresh : I.book;
  const visto = d.status === 'done'
    ? `<span class="pl-check">${I.checkCircle}</span>`
    : d.status === 'partial'
      ? `<span class="pl-frac">${d.blocks_done}/${d.blocks_total}</span>`
      : d.status === 'missed'
        ? `<span class="pl-miss">—</span>`
        : '';
  const linha2 = d.is_rest_day
    ? 'Descanso — só o áudio do deslocamento'
    : [d.subject_name, d.topic_name].filter(Boolean).join(' · ') || DAY_KIND_LABEL[d.kind] || '';
  return `<div class="plano-day ${st.cls} ${d.is_today ? 'is-today' : ''}">
    <div class="pl-date"><span class="pl-dnum">${dia}</span><span class="pl-dweek">${semana}</span></div>
    <div class="pl-kind">${kindIcon}</div>
    <div class="pl-info">
      <div class="pl-title">${esc(DAY_KIND_LABEL[d.kind] || 'Conteúdo')}${d.is_today ? ' · hoje' : ''}</div>
      <div class="pl-sub">${esc(linha2)}</div>
    </div>
    ${visto}
  </div>`;
}

async function regenerateMission() {

  catch (e) { toast('Erro ao gerar nova missão', 'error'); }

async function startMissionBlock(blockIdx, type) {
  const b = S.mission?.blocks?.[blockIdx];
  if (!b || b.is_completed) return;
  S.activeMissionIdx = blockIdx;
  S.missionBlockId = b.id;
  if (type === 'practice') {
    // Bloco de revisão da semana (domingo) já vem com a lista exata de
    // questões; buscar por matéria ali sortearia outras e perderia o ponto.
    if (!b.subject_id && b.content_ids?.length) {
      S.selSubject = null; S.selSubjectName = b.title;
      S.subView = 'questions'; S.qIndex = 0; S.questions = []; S.answerResult = null;
      S.answered = {}; S.qStartedAt = Date.now();
      S.loading.questions = true; S.tab = 'practice'; render();
      try {
        const d = await api(`/api/prf/questions/list?limit=40&ids=${encodeURIComponent(b.content_ids.join(','))}`);
        S.questions = d.questions || [];
      } catch (e) { toast('Erro ao carregar questões', 'error'); }
      if (!S.questions.length) { toast('Nenhuma questão disponível — avançando', 'info'); await finishMissionBlock(); return; }
      S.loading.questions = false; render(); scrollTop();
      return;
    }
    const sid = b.subject_id;
    if (!sid) { toast('Sem matéria para questões — avançando', 'info'); await finishMissionBlock(); return; }
    // A missão já escolheu o tópico do dia (o mesmo da aula em áudio e da
    // lei seca); sem passar topic_id aqui o bloco caía num sorteio da
    // matéria inteira, desligado do que a missão de fato montou.
    const tid = b.topic_id || '';
    S.selSubject = sid; S.selSubjectName = b.subject_name || b.title;
    S.subView = 'questions'; S.qIndex = 0; S.questions = []; S.answerResult = null; S.answered = {}; S.qStartedAt = Date.now();
    S.loading.questions = true; S.tab = 'practice'; render();
    try {
      const isPM = S.targetExam && S.targetExam.startsWith('PM');
      // PMGO estuda nos dois formatos. O simulado continua 100% A-E porque
      // simula a prova, mas travar a prática diária em multipla_escolha
      // escondia 1.736 das 2.204 questões do banco de quem faz PMGO. O
      // conteúdo é o mesmo, C/E treina precisão de afirmação, e a banca do
      // próximo certame ainda não está definida.
      const typeQs = isPM ? '' : '&question_type=certo_errado';
      const topicQs = tid ? `&topic_id=${tid}` : '';
      let d = await api(`/api/prf/questions/list?subject_id=${sid}${topicQs}&limit=15${typeQs}`);
      S.questions = d.questions || [];
      // Tópico do dia pode não ter estoque suficiente: cai pra matéria inteira.
      if (!S.questions.length && tid) {
        d = await api(`/api/prf/questions/list?subject_id=${sid}&limit=15${typeQs}`);
        S.questions = d.questions || [];
      }
      // For PRF only: fall back to any question type if no typed questions found
      if (!S.questions.length && !isPM) {
        d = await api(`/api/prf/questions/list?subject_id=${sid}&limit=15`);
        S.questions = d.questions || [];
      }
      if (!S.questions.length) {
        toast('Nenhuma questão disponível — avançando', 'info');
        await finishMissionBlock();
        return;
      }
    } catch (e) { toast('Erro ao carregar questões', 'error'); }
    S.loading.questions = false; render(); scrollTop();
  } else if (type === 'review') {
    await openMissionReview(blockIdx);
    return;
  } else if (type === 'legal') {
    await openMissionLegalReader(blockIdx);
    return;
  } else if (type === 'flashcards') {
    await openMissionFlashcards(blockIdx);
    return;
  } else if (type === 'podcast') {
    const epId = b.content_ids?.[0];
    if (!epId) { toast('Episódio indisponível', 'error'); return; }
    S.podKind = b.block_type === 'podcast_drill' ? 'drill' : 'aula';
    await playPodcast(epId, { tela: true });
    return;
  } else if (type === 'video') {
    // O vídeo já toca embutido no cartão da missão; aqui só se confirma que
    // foi assistido e a unidade avança para a lei seca.
    await finishMissionBlock(false);
    toast('Videoaula concluída', 'success');
    return;
  } else if (type === 'simulado') {
    // Sábado: a missão inteira é o simulado. Ele fecha sozinho quando o
    // candidato finaliza a prova (ver finishSimulado).
    S.pendingSimBlockId = b.id;
    switchTab('simulado');
    return;
  } else {
    switchTab('practice');
  }
}
async function finishMissionBlock(advance = true) {
  const bid = S.missionBlockId;
  if (!bid) return;
  S.missionBlockId = null;
  try {
    await api('/api/prf/missions/blocks/complete', {
      method:'POST', json:{ block_id: bid },
    });
  } catch (e) {}
  S.mission = null;
  await loadMission();
  // A aula em áudio não encadeia na etapa seguinte: a segunda é para a
  // volta do trabalho e a lei seca é para a noite, não para agora.
  if (advance) advanceToNextMissionBlock();
  else { S.activeMissionIdx = null; render(); }
}
function advanceToNextMissionBlock() {
  if (!S.mission || !S.mission.blocks) return;
  const blocks = S.mission.blocks;
  const next = blocks.find(b => !b.is_completed);
  if (!next) {
    toast('Missão cumprida!', 'success');
    S.activeMissionIdx = null;
    S.missionBlockId = null;
    switchTab('dashboard');
    return;
  }
  const nextIdx = blocks.indexOf(next);
  // Videoaula e simulado não encadeiam sozinhos: um toca dentro do próprio
  // cartão e o outro é uma sessão de 3 horas. Avançar automaticamente para
  // eles marcaria o vídeo como assistido sem ninguém ter assistido nada.
  if (next.block_type === 'video_lesson' || next.block_type === 'simulado') {
    S.activeMissionIdx = null;
    S.missionBlockId = null;
    switchTab('dashboard');
    toast(`Próxima etapa: ${next.title}`, 'info');
    return;
  }
  const type = blockActionType(next);
  toast(`Próxima etapa: ${next.title}`, 'info');
  setTimeout(() => startMissionBlock(nextIdx, type), 1500);
}
async function loadSubjects() {
  try {
    const exam = S.targetExam || 'PMGO';
    const [d, res] = await Promise.all([
      api(`/api/prf/onboarding/subjects?exam=${encodeURIComponent(exam)}`),
      api('/api/prf/onboarding/resources').catch(() => []),
    ]);
    S.subjects = d.subjects || d;
    S.resources = Array.isArray(res) ? res : [];
  }
  catch (e) { toast('Erro ao carregar matérias', 'error'); S.subjects = []; S.resources = []; }
  render();
}

// Practice
async function selectSubject(id, name) {
  S.selSubject = id; S.selSubjectName = name; S.subView = 'questions';
  S.qIndex = 0; S.questions = []; S.answerResult = null; S.answered = {}; S.qStartedAt = Date.now();
  S.loading.questions = true; render();
  try {
    const isPM = S.targetExam && S.targetExam.startsWith('PM');
    // PMGO recebe os dois formatos na prática (ver comentário em
    // startMissionBlock). Simulado segue só A-E.
    const typeQs = isPM ? '' : '&question_type=certo_errado';
    let d = await api(`/api/prf/questions/list?subject_id=${id}&limit=20${typeQs}`);
    S.questions = d.questions || [];
    if (!S.questions.length) {
      d = await api(`/api/prf/questions/list?subject_id=${id}&limit=20`);
      S.questions = d.questions || [];
    }
  } catch (e) { toast('Erro ao carregar questões', 'error'); }
  S.loading.questions = false; render(); scrollTop();
}
async function answerQuestion(qid, altId) {
  if (S.answerResult) return;
  const elapsed = S.qStartedAt ? Math.round((Date.now() - S.qStartedAt) / 1000) : null;
  try {
    S.answerResult = await api('/api/prf/questions/answer', {
      method:'POST', json:{ question_id: qid, selected_alternative_id: altId, time_spent_secs: elapsed },
    });
    S.answered[S.qIndex] = S.answerResult.is_correct;
    if (S.answerResult.xp_earned) toast(`+${S.answerResult.xp_earned} XP`, 'xp');
  } catch (e) { toast('Erro ao responder', 'error'); }
  render();
}
function nextQuestion() {
  if (S.qIndex < S.questions.length - 1) {
    S.qIndex++; S.answerResult = null; S.qStartedAt = Date.now(); render(); scrollTop();
  } else if (S.activeMissionIdx != null) {
    toast('Etapa concluída!', 'success');
    finishMissionBlock();
  } else {
    goBack();
  }
}

// Simulado
// O timer e o progresso antes só existiam na memória do JS — celular
// travando a tela, aba recarregando ou o navegador matando o processo em
// background durante as 4h30 de prova apagava a tentativa inteira, sem
// chance de recuperar. Guarda só o exam_id no localStorage; tudo o mais
// (perguntas, respostas, tempo restante) é reconstruído do servidor.
const SIM_ID_KEY = 'prf_sim_active_id';
function _startSimTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    S.simSeconds--;
    const el = document.querySelector('.sim-timer');
    if (el) {
      el.innerHTML = `${I.clock}<span>${fmtTime(S.simSeconds)}</span>`;
      if (S.simSeconds < 600) el.classList.add('danger');
    }
    if (S.simSeconds <= 0) { clearInterval(timerInterval); finishSimulado(); }
  }, 1000);
}
async function generateSimulado() {
  S.loading.sim = true; render();
  try {
    S.sim = await api('/api/prf/simulados/generate', { method:'POST' });
    localStorage.setItem(SIM_ID_KEY, S.sim.id);
    const blockNums = Object.keys(S.sim.blocks || {}).map(k => parseInt(k.replace('bloco_', '')));
    S.simBlock = blockNums[0] || 1; S.simAnswers = {}; S.simResult = null;
    S.simIndex = {}; blockNums.forEach(n => S.simIndex[n] = 0);
    S.simSeconds = (S.sim.time_limit_mins || 270) * 60;
    for (const b of blockNums) {
      try {
        const d = await api(`/api/prf/simulados/${S.sim.id}/questions?block=${b}`);
        S.simQuestions[b] = d.questions || [];
      } catch (e) { S.simQuestions[b] = []; }
    }
    _startSimTimer();
  } catch (e) { toast('Erro ao gerar simulado', 'error'); }
  S.loading.sim = false; render(); scrollTop();
}
async function resumeSimuladoIfAny() {
  const id = localStorage.getItem(SIM_ID_KEY);
  if (!id || S.sim) return;
  let meta;
  try { meta = await api(`/api/prf/simulados/${id}`); }
  catch (e) { localStorage.removeItem(SIM_ID_KEY); return; }
  if (meta.is_completed) { localStorage.removeItem(SIM_ID_KEY); return; }

  const elapsedSecs = Math.floor((Date.now() - new Date(meta.started_at).getTime()) / 1000);
  const secondsLeft = (meta.time_limit_mins || 270) * 60 - elapsedSecs;

  S.sim = meta;
  S.simAnswers = {};
  Object.entries(meta.answers || {}).forEach(([qid, a]) => { S.simAnswers[qid] = a.selected; });
  const blockNums = Object.keys(meta.blocks || {}).map(k => parseInt(k.replace('bloco_', '')));
  S.simBlock = blockNums[0] || 1; S.simResult = null;
  S.simIndex = {}; blockNums.forEach(n => S.simIndex[n] = 0);

  if (secondsLeft <= 0) {
    S.simSeconds = 0;
    toast('O tempo do seu simulado esgotou enquanto você estava fora', 'info');
    await finishSimulado();
    return;
  }
  S.simSeconds = secondsLeft;
  for (const b of blockNums) {
    try {
      const d = await api(`/api/prf/simulados/${id}/questions?block=${b}`);
      S.simQuestions[b] = d.questions || [];
    } catch (e) { S.simQuestions[b] = []; }
  }
  _startSimTimer();
  toast('Simulado retomado de onde você parou', 'success');
  S.tab = 'simulado'; render(); scrollTop();
}
function switchSimBlock(b) { S.simBlock = b; render(); scrollTop(); }
function prevSimQ() { if ((S.simIndex[S.simBlock]||0) > 0) { S.simIndex[S.simBlock]--; render(); scrollTop(); } }
function nextSimQ() {
  const qs = S.simQuestions[S.simBlock] || [];
  if ((S.simIndex[S.simBlock]||0) < qs.length - 1) { S.simIndex[S.simBlock]++; render(); scrollTop(); }
}
async function answerSimQ(qid, sel) {
  S.simAnswers[qid] = sel;
  try { await api(`/api/prf/simulados/${S.sim.id}/answer?question_id=${qid}&selected=${sel}`, { method:'POST' }); }
  catch (e) {}
  render();
  setTimeout(nextSimQ, 280);
}
function confirmFinishSim() { if (confirm('Finalizar a prova? Esta ação não pode ser desfeita.')) finishSimulado(); }
function confirmExitSim() { if (confirm('Sair do simulado? Seu progresso já está salvo — você pode retomar depois nesta mesma tela.')) resetSimulado(); }
async function finishSimulado() {
  clearInterval(timerInterval);
  localStorage.removeItem(SIM_ID_KEY);
  try { S.simResult = await api(`/api/prf/simulados/${S.sim.id}/finish`, { method:'POST' }); }
  catch (e) { toast('Erro ao finalizar', 'error'); }
  // Sábado: o simulado É a missão do dia. Terminar a prova fecha o bloco.
  if (S.pendingSimBlockId) {
    const bid = S.pendingSimBlockId;
    S.pendingSimBlockId = null;
    try {
      await api('/api/prf/missions/blocks/complete', { method:'POST', json:{ block_id: bid } });
      S.mission = null; await loadMission();
    } catch (e) {}
  }
  render(); scrollTop();
}
function resetSimulado() {
  // Só limpa o estado em memória — o exam_id no localStorage permanece,
  // então se ainda houver simulado em aberto no servidor (saiu sem
  // finalizar), resumeSimuladoIfAny() o retoma na próxima vez que a aba
  // Simulado abrir. finishSimulado() é o único lugar que de fato encerra.
  clearInterval(timerInterval);
  S.sim = null; S.simQuestions = {}; S.simResult = null; S.simAnswers = {};
  S.simIndex = {}; S.simBlock = 1; S.simSeconds = 0;
  render(); scrollTop();
}

// Audio
async function loadLessons() {
  try { const d = await api('/api/prf/commute/lessons?limit=50'); S.lessons = d.lessons || []; }
  catch (e) { S.lessons = []; toast('Erro ao carregar audiobooks', 'error'); }
  render();
}
async function toggleLesson(id) {
  if (S.playingId === id) { togglePlayPause(); return; }
  if (S.podId) stopPodcast();   // um só elemento de áudio para os dois modos
  S.playingId = id; S.audioPlaying = false; S.audioPos = 0; S.audioDur = 0;
  render();
  toast('Gerando áudio...', 'info');
  try {
    const r = await fetch(`${API}/api/prf/commute/audio/${id}`, {
      headers: { 'Authorization': `Bearer ${S.token}` },
    });
    if (!r.ok) throw new Error('audio fetch failed');
    const blob = await r.blob();
    audioEl.src = URL.createObjectURL(blob);
    await audioEl.play();
    S.audioPlaying = true;
  } catch (e) {
    toast('Áudio indisponível no momento', 'error');
    S.playingId = null;
  }
  render();
}
function togglePlayPause() {
  if (!S.playingId && !S.podId) return;
  if (audioEl.paused) { audioEl.play(); S.audioPlaying = true; }
  else { audioEl.pause(); S.audioPlaying = false; }
  render();
}
function playNextLesson() {
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx >= 0 && idx < lessons.length - 1) toggleLesson(lessons[idx + 1].id);
}
function playPrevLesson() {
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx > 0) toggleLesson(lessons[idx - 1].id);
}
function stopAudio() {
  audioEl.pause(); audioEl.currentTime = 0;
  S.playingId = null; S.audioPlaying = false; S.audioPos = 0; S.audioDur = 0;
  render();
}
function seekAudio(ev) {
  const track = ev.currentTarget;
  const rect = track.getBoundingClientRect();
  const pct = (ev.clientX - rect.left) / rect.width;
  if (isFinite(audioEl.duration)) audioEl.currentTime = pct * audioEl.duration;
}
let _podLastSave = 0;
audioEl.addEventListener('timeupdate', () => {
  S.audioPos = audioEl.currentTime; S.audioDur = audioEl.duration || 0;
  const fill = document.querySelector('.pb-fill');
  const times = document.querySelectorAll('.pb-time');
  if (fill && S.audioDur > 0) fill.style.width = `${(S.audioPos / S.audioDur) * 100}%`;
  if (times[0]) times[0].textContent = fmtTime(S.audioPos);
  if (times[1]) times[1].textContent = fmtTime(S.audioDur);

  // Episódio de podcast: o arquivo é um só, então "segmento atual" é só
  // uma leitura de posição contra os limites, não mais um arquivo à parte.
  if (S.podId && S.pod && S.podBoundaries?.length) {
    if (S.audioPos - _podLastSave >= 3) { _podLastSave = S.audioPos; savePodProgress(); }
    const idx = S.podBoundaries.findIndex(b => S.audioPos < b);
    const newSeq = idx === -1 ? S.pod.segment_count - 1 : idx;
    if (newSeq !== S.podSeq) { S.podSeq = newSeq; render(); }
  }
});
audioEl.addEventListener('ended', () => {
  S.audioPlaying = false;
  if (S.podId && S.pod) {
    toast('Aula concluída', 'success');
    clearPodProgress(S.podId);
    stopPodcast();
    // Etapa da missão fecha aqui, mas sem puxar a próxima: a segunda
    // aula é da volta e a lei seca é da noite.
    if (S.missionBlockId) finishMissionBlock(false);
    return;
  }
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx >= 0 && idx < lessons.length - 1) {
    toast('Próxima aula...', 'info');
    toggleLesson(lessons[idx + 1].id);
  } else {
    S.playingId = null;
    toast('Playlist concluída', 'success');
    render();
  }
});

// ===== PODCAST (episódios em diálogo) =====
async function loadPodcasts() {
  try { const d = await api('/api/prf/commute/podcast?limit=50'); S.podcasts = d.episodes || []; }
  catch (e) { S.podcasts = []; }
  render();
}

// Pula pra um trecho do episódio. Antes cada "parte" era um arquivo de
// áudio separado buscado sob demanda — o toque em "próxima" (ou o fim
// natural de uma parte) dependia do JS acordar pra buscar a próxima, e no
// celular com a tela bloqueada durante o trajeto esse acordar não era
// garantido: o áudio simplesmente parava. Agora o episódio inteiro já
// tocou como um arquivo só (playPodcast), e aqui é só um seek.
function playPodSegment(seq) {
  if (!S.pod || !S.podBoundaries?.length || seq < 0 || seq >= S.pod.segment_count) return;
  audioEl.currentTime = seq > 0 ? S.podBoundaries[seq - 1] : 0;
  S.podSeq = seq;
  savePodProgress();
  if (audioEl.paused) { audioEl.play().catch(() => {}); S.audioPlaying = true; }
  render();
}

// Retomada. Uma aula pode passar dos 40 min do trajeto, então sem isso o
// ouvinte recomeça do zero todo dia e nunca chega ao fim do episódio.
// Guarda o tempo exato (não só a parte) porque agora é um arquivo só.
function podProgressKey(id) { return `pod_seg_${id}`; }
function podTimeKey(id) { return `pod_time_${id}`; }
function savePodProgress() {
  if (!S.podId) return;
  try {
    localStorage.setItem(podProgressKey(S.podId), String(S.podSeq));
    localStorage.setItem(podTimeKey(S.podId), String(audioEl.currentTime || 0));
  } catch (e) {}
}
function loadPodProgress(id) {
  try { return parseInt(localStorage.getItem(podProgressKey(id)) || '0', 10) || 0; }
  catch (e) { return 0; }
}
function loadPodTime(id) {
  try { return parseFloat(localStorage.getItem(podTimeKey(id)) || '0') || 0; }
  catch (e) { return 0; }
}
function clearPodProgress(id) {
  try { localStorage.removeItem(podProgressKey(id)); localStorage.removeItem(podTimeKey(id)); } catch (e) {}
}

async function playPodcast(id, opts) {
  const tela = !!(opts && opts.tela);
  if (S.podId === id && !tela) { togglePlayPause(); return; }
  if (S.podId === id && tela) { S.subView = 'podcastNow'; S.tab = 'audio'; render(); return; }
  stopAudio();
  S.podId = id; S.pod = null; S.podSeq = 0; S.podBoundaries = null;
  S.podLoading = true;
  if (tela) { S.subView = 'podcastNow'; S.tab = 'audio'; }
  render();
  try { S.pod = await api(`/api/prf/commute/podcast/${id}`); }
  catch (e) {
    S.podId = null; S.podLoading = false;
    toast('Erro ao abrir episódio', 'error'); render(); return;
  }
  if (!S.pod.segment_count) {
    S.podId = null; S.podLoading = false;
    toast('Episódio sem áudio disponível', 'error'); render(); return;
  }
  const savedTime = loadPodTime(id);
  toast(savedTime > 0 ? 'Retomando de onde parou' : 'Preparando o áudio...', 'info');
  try {
    const r = await fetch(`${API}/api/prf/commute/podcast/${id}/full`, {
      headers: { 'Authorization': `Bearer ${S.token}` },
    });
    if (!r.ok) throw new Error('full fetch failed');
    const header = r.headers.get('X-Segment-Boundaries') || '';
    S.podBoundaries = header.split(',').filter(Boolean).map(Number);
    const blob = await r.blob();
    if (S.podId !== id) return; // usuário trocou de episódio enquanto isso baixava
    S.podLoading = false;
    audioEl.src = URL.createObjectURL(blob);
    const resume = () => {
      const dur = audioEl.duration || 0;
      if (savedTime > 0 && savedTime < dur) audioEl.currentTime = savedTime;
      audioEl.removeEventListener('loadedmetadata', resume);
    };
    audioEl.addEventListener('loadedmetadata', resume);
    if (S.podBoundaries.length) {
      const idx = S.podBoundaries.findIndex(b => savedTime < b);
      S.podSeq = idx === -1 ? 0 : idx;
    }
    try { await audioEl.play(); S.audioPlaying = true; }
    catch (e) { S.audioPlaying = false; }
    render();
  } catch (e) {
    S.podLoading = false;
    toast('Não foi possível carregar o áudio', 'error');
    render();
  }
}

function podNext() { if (S.pod && S.podSeq < S.pod.segment_count - 1) playPodSegment(S.podSeq + 1); }
function podPrev() { if (S.pod && S.podSeq > 0) playPodSegment(S.podSeq - 1); }

function stopPodcast() {
  audioEl.pause(); audioEl.currentTime = 0;
  S.podId = null; S.pod = null; S.podSeq = 0; S.podBoundaries = null;
  S.podLoading = false;
  S.audioPlaying = false; S.audioPos = 0; S.audioDur = 0;
  render();
}

async function listenArticle(text) {
  if (!text) return;
  toast('Gerando áudio...', 'info');
  try {
    const r = await fetch(`${API}/api/prf/commute/synthesize?text=${encodeURIComponent(text.slice(0, 4000))}`, {
      method: 'POST', headers: { 'Authorization': `Bearer ${S.token}` },
    });
    if (!r.ok) throw new Error('tts failed');
    const blob = await r.blob();
    audioEl.src = URL.createObjectURL(blob);
    await audioEl.play();
  } catch (e) { toast('Áudio indisponível', 'error'); }
}

// Mission Legal Reader
async function openMissionLegalReader(blockIdx) {
  const b = S.mission?.blocks?.[blockIdx];
  if (!b) return;
  S.activeMissionIdx = blockIdx;
  S.missionBlockId = b.id;
  S.missionLegalArticles = null;
  S.missionLegalIdx = 0;
  S.lfStep = 'ler'; S.lfRevealed = [];
  S.subView = 'missionLegal';
  S.tab = 'more';
  render();
  const ids = b.content_ids || [];
  if (!ids.length) { await finishMissionBlock(); return; }
  const articles = [];
  for (const id of ids) {
    try { articles.push(await api(`/api/prf/legal/articles/${id}`)); } catch (e) {}
  }
  S.missionLegalArticles = articles.length ? articles : [];
  if (!articles.length) { await finishMissionBlock(); return; }
  render(); scrollTop();
}
function nextLegalArticle() {
  const a = S.missionLegalArticles?.[S.missionLegalIdx];
  if (a?.id) api(`/api/prf/legal/articles/${a.id}/read`, { method: 'POST' }).catch(() => {});
  S.missionLegalIdx = (S.missionLegalIdx || 0) + 1;
  S.lfStep = 'ler'; S.lfRevealed = [];
  render(); scrollTop();
}
async function concludeLegalReading() {
  const a = S.missionLegalArticles?.[S.missionLegalIdx];
  if (a?.id) api(`/api/prf/legal/articles/${a.id}/read`, { method: 'POST' }).catch(() => {});
  await finishMissionBlock();
}

// Mission Review (question-based)
async function openMissionReview(blockIdx) {
  const b = S.mission?.blocks?.[blockIdx];
  if (!b) return;
  S.activeMissionIdx = blockIdx;
  S.missionBlockId = b.id;
  S.reviews = null;
  S.reviewIdx = 0;
  S.reviewQuestion = null;
  S.reviewAnswered = null;
  S.subView = 'missionReview';
  S.tab = 'more';
  render();
  // Os cartões do bloco vêm da missão (incluem os do dia anterior, que ainda
  // não venceram); /due sozinho devolveria só o que o SM-2 já liberou e a
  // revisão de ontem nunca apareceria.
  const ids = (b.content_ids || []).join(',');
  const url = ids ? `/api/prf/reviews/due?limit=40&ids=${encodeURIComponent(ids)}`
                  : '/api/prf/reviews/due?limit=20';
  try { S.reviews = await api(url); }
  catch (e) { S.reviews = []; }
  if (!S.reviews?.length && ids) {
    try { S.reviews = await api('/api/prf/reviews/due?limit=20'); } catch (e) { S.reviews = []; }
  }
  if (!S.reviews?.length) { await finishMissionBlock(); return; }
  await loadMissionReviewQuestion();
  render(); scrollTop();
}
async function loadMissionReviewQuestion() {
  const card = S.reviews?.[S.reviewIdx];
  if (!card) return;
  S.reviewAnswered = null;
  S.reviewQuestion = null;
  if (card.question_id) {
    try { S.reviewQuestion = await api(`/api/prf/questions/${card.question_id}`); } catch (e) {}
  }
}
async function answerMissionReview(questionId, altId) {
  if (S.reviewAnswered) return;
  try {
    S.reviewAnswered = await api('/api/prf/questions/answer', {
      method: 'POST', json: { question_id: questionId, selected_alternative_id: altId },
    });
  } catch (e) { toast('Erro ao registrar resposta', 'error'); }
  render(); scrollTop();
}
async function submitMissionReview(cardId, quality) {
  try {
    const r = await api('/api/prf/reviews/submit', { method:'POST', json:{ card_id: cardId, quality } });
    if (r?.xp_earned) toast(`+${r.xp_earned} XP`, 'xp');
  } catch (e) {}
  S.reviewIdx++;
  S.reviewAnswered = null;
  S.reviewQuestion = null;
  if (S.reviewIdx >= (S.reviews?.length || 0)) {
    await finishMissionBlock();
    return;
  }
  await loadMissionReviewQuestion();
  render(); scrollTop();
}

// Histórico
function openHistory() {
  S.tab = 'more'; S.subView = 'history'; S.history = null; render(); scrollTop();
  loadHistory();
}
async function loadHistory() {
  try { const d = await api('/api/prf/questions/history?limit=100'); S.history = d.history || []; }
  catch (e) { S.history = []; toast('Erro ao carregar histórico', 'error'); }
  try {
    const m = await api('/api/prf/missions/history?days=30');
    const rows = (m.history || []).slice().sort((a,b) => a.date.localeCompare(b.date));
    const trackedDays = rows.length;
    const completedDays = rows.filter(r => r.mission_completed).length;
    let longest = 0, current = 0;
    rows.forEach(r => { current = r.mission_completed ? current + 1 : 0; longest = Math.max(longest, current); });
    S.consistency = { trackedDays, completedDays,
      pct: trackedDays ? Math.round(completedDays / trackedDays * 100) : 0, longestStreak: longest };
  } catch (e) { S.consistency = null; }
  render();
}
function viewHistory() {
  const head = `<div class="topbar-sub"><button class="back-btn" aria-label="Voltar" onclick="goBack()">${I.back}</button><span class="title-sub">Histórico de respostas</span></div>`;
  if (!S.history) return head + skeletonBlock(5, 60);
  if (!S.history.length) return head + `<div class="empty">${I.book}<h3>Nenhuma resposta ainda</h3><p>Responda questões para ver seu histórico aqui.</p></div>`;
  const grouped = {};
  S.history.forEach(h => {
    const d = new Date(h.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
    (grouped[d] = grouped[d] || []).push(h);
  });
  return head + `<div class="fade-in" style="padding-bottom:24px">
    <div class="hero-block">
      <div class="section-eyebrow">Suas respostas</div>
      <div class="section-title">${S.history.length} questões respondidas</div>
      <div class="chip-row mt-8">
        <span class="level-chip" style="background:var(--success-soft);color:var(--success)">${S.history.filter(h=>h.is_correct).length} certas</span>
        <span class="level-chip" style="background:var(--error-soft);color:var(--error)">${S.history.filter(h=>!h.is_correct).length} erradas</span>
      </div>
    </div>
    ${S.consistency && S.consistency.trackedDays ? `<div class="consistency-block">
      <div class="section-eyebrow">Consistência (30 dias)</div>
      <div class="consistency-row">
        <div class="consistency-cell"><div class="cc-num">${S.consistency.pct}<span class="cc-unit">%</span></div><div class="cc-label">missões concluídas</div></div>
        <div class="consistency-cell"><div class="cc-num">${S.consistency.longestStreak}</div><div class="cc-label">sequência máxima</div></div>
        <div class="consistency-cell"><div class="cc-num">${S.consistency.completedDays}/${S.consistency.trackedDays}</div><div class="cc-label">dias com registro</div></div>
      </div>
    </div>` : ''}
    ${Object.entries(grouped).map(([date, items]) => `
      <div class="hist-date">${date}</div>
      ${items.map(h => {
        const txt = (h.text || '').length > 90 ? h.text.slice(0, 87) + '...' : (h.text || '');
        return `<div class="hist-row ${h.is_correct ? 'correct' : 'wrong'}">
          <div class="hist-dot">${h.is_correct ? '<svg viewBox="0 0 24 24" fill="var(--success)" width="18"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : '<svg viewBox="0 0 24 24" fill="var(--error)" width="18"><path d="M18 6L6 18M6 6l12 12" stroke="var(--error)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>'}</div>
          <div class="hist-info">
            <div class="hist-q">${esc(txt)}</div>
            <div class="hist-meta">${esc(h.subject_name || '')}${h.selected_letter ? ` · Marcou ${h.selected_letter}` : ''}${h.correct_letter && !h.is_correct ? ` · Gabarito ${h.correct_letter}` : ''}</div>
          </div>
        </div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

// day_of_week: 0=segunda ... 6=domingo (padrão Python weekday(), igual ao schema).
const DIAS_SEMANA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
function _defaultRoutine() {
  // Sugestão inicial — usuário com expediente 08h-18h seg-sex, 40min de
  // deslocamento cada trecho, futebol seg à noite, culto ter e dom,
  // ensaio quinta (alternado), sáb livre. Tudo editável antes de salvar.
  return [
    { day_of_week:0, study_minutes:30,  commute_minutes:40, typical_energy:'low',    is_rest_day:false }, // seg — futebol à noite
    { day_of_week:1, study_minutes:60,  commute_minutes:40, typical_energy:'medium', is_rest_day:false }, // ter — culto
    { day_of_week:2, study_minutes:120, commute_minutes:40, typical_energy:'high',   is_rest_day:false }, // qua — livre
    { day_of_week:3, study_minutes:75,  commute_minutes:40, typical_energy:'medium', is_rest_day:false }, // qui — ensaio às vezes
    { day_of_week:4, study_minutes:90,  commute_minutes:40, typical_energy:'medium', is_rest_day:false }, // sex — livre
    { day_of_week:5, study_minutes:150, commute_minutes:0,  typical_energy:'high',   is_rest_day:false }, // sáb — dia livre
    { day_of_week:6, study_minutes:45,  commute_minutes:0,  typical_energy:'low',    is_rest_day:false }, // dom — culto
  ];
}
function openSettings() {
  S.tab = 'more'; S.subView = 'settings'; render(); scrollTop();
  if (!S.studyProfile) loadStudyProfile();
}
async function loadStudyProfile() {
  let profileData = { exam_date:'', study_level:'beginner', prioritySubjects:[], municipio:'', target_cutoff_score:'' };
  let routines = null;
  try {
    const p = await api('/api/prf/onboarding/profile');
    profileData = { exam_date: p.exam_date || '', study_level: p.study_level || 'beginner',
      prioritySubjects: p.priority_subjects || [], municipio: p.municipio || '',
      target_cutoff_score: p.target_cutoff_score != null ? p.target_cutoff_score : '' };
  } catch (e) {}
  try {
    const r = await api('/api/prf/onboarding/routines');
    if (Array.isArray(r) && r.length) {
      routines = _defaultRoutine().map(d => {
        const found = r.find(x => x.day_of_week === d.day_of_week);
        return found ? { day_of_week: d.day_of_week, study_minutes: found.study_minutes,
          commute_minutes: found.commute_minutes || 0, typical_energy: found.typical_energy || 'medium',
          is_rest_day: !!found.is_rest_day } : d;
      });
    }
  } catch (e) {}
  S.studyProfile = { ...profileData, routines: routines || _defaultRoutine(), isDefaultRoutine: !routines };
  render();
}
async function saveStudyProfile() {
  const p = S.studyProfile;
  S.savingProfile = true; render();
  const totalMin = p.routines.reduce((s,d) => s + (d.is_rest_day ? 0 : d.study_minutes), 0);
  try {
    await api('/api/prf/onboarding/profile', {
      method: 'PATCH',
      json: {
        exam_date: p.exam_date || null,
        weekly_goal_hours: Math.max(1, Math.round(totalMin / 60)),
        study_level: p.study_level,
        priority_subjects: p.prioritySubjects || [],
        municipio: p.municipio || null,
        target_cutoff_score: p.target_cutoff_score !== '' && p.target_cutoff_score != null ? Number(p.target_cutoff_score) : null,
      },
    });
    await api('/api/prf/onboarding/routines', { method: 'PATCH', json: { routines: p.routines } });
    S.studyProfile.isDefaultRoutine = false;
    S.mission = null; // força a missão de hoje a recalcular com a nova rotina
    toast('Rotina salva — sua missão vai se ajustar', 'success');
  } catch (e) { toast('Erro ao salvar rotina', 'error'); }
  S.savingProfile = false; render();
}
function _updateRoutineDay(idx, field, value) {
  const d = S.studyProfile.routines[idx];
  if (field === 'study_minutes' || field === 'commute_minutes') d[field] = parseInt(value) || 0;

  else d[field] = value;

  const list = S.studyProfile.prioritySubjects || [];
  S.studyProfile.prioritySubjects = checked
    ? [...new Set([...list, slug])]

  render();
}

function updateEssayCounter() {

  const lt = document.getElementById('line-count-top');

async function loadTAF() {
  S.taf = { history: [], projections: [], targets: {} };

      api('/api/prf/taf/history'),
      api('/api/prf/taf/projection'),
    ]);
    S.taf = { history: hist || [], projections: (proj && proj.projections) || [], targets: (proj && proj.targets) || {} };
  } catch (e) {}
  S.tafForm = { barra_reps:'', flexao_reps:'', abdominal_reps:'', corrida_12min_metros:'', notes:'' };

async function submitTAFRecord() {
  const f = S.tafForm || {};
  const body = {};
  ['barra_reps','flexao_reps','abdominal_reps','corrida_12min_metros'].forEach(k => {
    if (f[k] !== '' && f[k] != null) body[k] = parseInt(f[k]) || 0;

  if (f.notes) body.notes = f.notes;
  if (!Object.keys(body).length) { toast('Preencha ao menos uma medição', 'error'); return; }
  S.loading.taf = true; render();
  try {
    await api('/api/prf/taf/record', { method:'POST', json:body });
    toast('Medição registrada', 'success');
    await loadTAF();
  } catch (e) { toast('Erro ao registrar medição', 'error'); }
  S.loading.taf = false; render();
}
async function saveTAFTargets() {
  const t = (S.taf && S.taf.targets) || {};
  try {
    await api('/api/prf/taf/targets', { method:'PATCH', json:{
      barra_reps: t.barra_reps || null, flexao_reps: t.flexao_reps || null,
      abdominal_reps: t.abdominal_reps || null, corrida_12min_metros: t.corrida_12min_metros || null,
    }});
    toast('Meta salva', 'success');
    await loadTAF();
  } catch (e) { toast('Erro ao salvar meta', 'error'); }
}

// Checklist
function openChecklist() {
  S.tab = 'more'; S.subView = 'checklist'; render(); scrollTop();
  if (!S.checklist) loadChecklist();
}
async function loadChecklist() {
  try { S.checklist = await api('/api/prf/checklist/'); }
  catch (e) { S.checklist = { by_category:{}, total:0, done:0 }; }
  render();
}
async function toggleChecklistItem(key, isDone) {
  try {
    await api(`/api/prf/checklist/${key}`, { method:'PATCH', json:{ is_done: isDone } });
    await loadChecklist();
  } catch (e) { toast('Erro ao atualizar item', 'error'); }
}

// ===== INIT =====
applyTheme();
applyExamTheme(S.targetExam);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (S.theme === 'auto') applyTheme();
});

async function seedRoutineIfMissing() {
  if (localStorage.getItem('routine_seeded')) return;
  try {
    const r = await api('/api/prf/onboarding/routines');
    if (Array.isArray(r) && r.length) { localStorage.setItem('routine_seeded', '1'); return; }
  } catch (e) {}
  try {
    await api('/api/prf/onboarding/routines', { method: 'PATCH', json: { routines: _defaultRoutine() } });
    localStorage.setItem('routine_seeded', '1');
  } catch (e) {}
}

async function init() {
  try { await ensureAuth(); }
  catch (e) {
    toast('Erro de conexão. Tentando novamente...', 'error');
    setTimeout(init, 3000); return;
  }
  // App agora atende só ao concurso PMGO — força o perfil, mesmo que o
  // dispositivo tenha um target_exam='PRF' salvo de uma versão anterior.
  if (S.targetExam !== 'PMGO') {
    S.targetExam = 'PMGO';
    localStorage.setItem('prf_target_exam', 'PMGO');
  }
  applyExamTheme('PMGO');
  api('/api/prf/onboarding/target-exam', { method:'PATCH', json:{ target_exam:'PMGO' } }).catch(() => {});
  seedRoutineIfMissing();
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => document.getElementById('splash')?.remove(), 400);
  render();
  loadDashboard();
  loadSubjects();
  loadCoverage();
  resumeSimuladoIfAny();
  flushOfflineQueue();

  // O service worker serve o app offline e recebe os lembretes. Registrar
  // depois da primeira renderização evita competir com o carregamento inicial;
  // a permissão de notificação continua só sendo pedida quando o usuário
  // ativa os lembretes em Mais.
  registrarSW().then(async () => {
    await sincronizarPush();
    if (S.pushOn) render();
  });
}
init();
</script>
</body>
</html>
