// ===== NAV / RENDER =====
function renderNav() {
  const tabs = [
    { id:'dashboard', icon:I.home,       label:'Início' },
    { id:'practice',  icon:I.book,       label:'Estudar' },
    { id:'simulado',  icon:I.target,     label:'Simulado' },
    { id:'audio',     icon:I.headphones, label:'Áudio' },
    { id:'more',      icon:I.grid,       label:'Mais' },
  ];
  return `<nav class="nav">${tabs.map(t =>
    `<button class="nav-item ${S.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.icon}<span>${t.label}</span></button>`
  ).join('')}</nav>`;
}

function render() {
  const views = {
    dashboard: viewDashboard, practice: viewPractice, simulado: viewSimulado,
    audio: viewAudio, more: viewMore,
  };
  const inSim = S.tab === 'simulado' && S.sim && !S.simResult;
  const inTutor = S.subView === 'tutor';
  document.getElementById('app').innerHTML = `
    <div class="content" id="main-content">${(views[S.tab] || viewDashboard)()}</div>
    ${inTutor ? '' : playerBar()}
    ${inSim ? '' : renderNav()}
  `;
  const mc = document.getElementById('main-content');
  if (mc) mc.addEventListener('scroll', () => {
    const ab = document.getElementById('appbar');
    if (ab) ab.classList.toggle('scrolled', mc.scrollTop > 4);
  });
  if (inTutor) {
    const cw = document.getElementById('chat-wrap');
    if (cw) cw.scrollIntoView({ block: 'end' });
    document.getElementById('main-content')?.scrollTo(0, 999999);
  }
}
function scrollTop() { document.getElementById('main-content')?.scrollTo(0, 0); }

// ===== ACTIONS =====
function switchTab(tab) {
  S.tab = tab; S.subView = null; S.answerResult = null; S.answered = {};
  render(); scrollTop();
  if (tab === 'dashboard') loadDashboard();
  if (tab === 'practice' && !S.subjects) loadSubjects();
  if (tab === 'audio' && !S.lessons) loadLessons();
  if (tab === 'more' && !S.reviewSummary) loadReviewSummary();
  if (tab === 'more' && !S.trilha) loadTrilha();
}
function goBack() {
  S.subView = null; S.answerResult = null; S.searchResults = null; S.searchQ = '';
  S.essayResult = null;
  render(); scrollTop();
}

// Dashboard
async function loadDashboard() {
  try {
    S.dashboard = await api('/api/prf/dashboard/');
    if (S.dashboard.target_exam && S.dashboard.target_exam !== S.targetExam) {
      S.targetExam = S.dashboard.target_exam;
      localStorage.setItem('prf_target_exam', S.targetExam);
    }
  } catch (e) {
    S.dashboard = { greeting:'Bem-vindo', streak:0, questions_today:0, accuracy_today:0,
      time_studied_today:0, reviews_due:0, approval_estimate:0, level:1, weekly_progress:[] };
  }
  render();
  if (!S.mission) loadMission();
}
async function loadMission() {
  try {
    S.mission = await api('/api/prf/missions/today');
  } catch (e) {
    S.mission = { status:'empty', blocks:[], blocks_total:0, blocks_done:0 };
  }
  render();
}
async function startMissionBlock(blockIdx, type) {
  const b = S.mission?.blocks?.[blockIdx];
  if (!b || b.is_completed) return;
  S.activeMissionIdx = blockIdx;
  S.missionBlockId = b.id;
  if (type === 'practice') {
    const sid = b.subject_id || (b.content_ids?.length ? b.content_ids[0] : null);
    if (!sid) { toast('Sem matéria para questões — avançando', 'info'); await finishMissionBlock(); return; }
    S.selSubject = sid; S.selSubjectName = b.subject_name || b.title;
    S.subView = 'questions'; S.qIndex = 0; S.questions = []; S.answerResult = null; S.answered = {}; S.qStartedAt = Date.now();
    S.loading.questions = true; S.tab = 'practice'; render();
    try {
      const qtype = (S.targetExam && S.targetExam.startsWith('PM')) ? 'multipla_escolha' : 'certo_errado';
      let d = await api(`/api/prf/questions/list?subject_id=${sid}&limit=15&question_type=${qtype}`);
      S.questions = d.questions || [];
      if (!S.questions.length) {
        d = await api(`/api/prf/questions/list?subject_id=${sid}&limit=15`);
        S.questions = d.questions || [];
      }
      if (!S.questions.length) {
        toast('Nenhuma questão disponível — avançando', 'info');
        await finishMissionBlock();
        return;
      }
    } catch (e) { toast('Erro ao carregar questões', 'error'); }
    S.loading.questions = false; render(); scrollTop();
  } else if (type === 'review') {
    switchTab('more'); openReviews();
  } else if (type === 'legal') {
    switchTab('more'); openLegal();
  } else if (type === 'audio') {
    switchTab('audio');
  } else {
    switchTab('practice');
  }
}
async function finishMissionBlock() {
  const bid = S.missionBlockId;
  if (!bid) return;
  S.missionBlockId = null;
  try {
    await api('/api/prf/missions/blocks/complete', {
      method:'POST', json:{ block_id: bid },
    });
  } catch (e) {}
  S.mission = null;
  await loadMission();
  advanceToNextMissionBlock();
}
function advanceToNextMissionBlock() {
  if (!S.mission || !S.mission.blocks) return;
  const blocks = S.mission.blocks;
  const next = blocks.find(b => !b.is_completed);
  if (!next) {
    toast('Missão cumprida!', 'success');
    S.activeMissionIdx = null;
    S.missionBlockId = null;
    switchTab('dashboard');
    return;
  }
  const nextIdx = blocks.indexOf(next);
  const type = next.block_type === 'questions' ? 'practice' :
    next.block_type === 'review' ? 'review' :
    next.block_type === 'legal_reading' ? 'legal' :
    (next.block_type === 'audio' || next.block_type === 'audio_lesson') ? 'audio' :
    next.block_type === 'error_review' ? 'review' : 'practice';
  toast(`Próxima etapa: ${next.title}`, 'info');
  setTimeout(() => startMissionBlock(nextIdx, type), 1500);
}
async function loadSubjects() {
  try { const d = await api('/api/prf/onboarding/subjects'); S.subjects = d.subjects || d; }
  catch (e) { toast('Erro ao carregar matérias', 'error'); S.subjects = []; }
  render();
}

// Practice
async function selectSubject(id, name) {
  S.selSubject = id; S.selSubjectName = name; S.subView = 'questions';
  S.qIndex = 0; S.questions = []; S.answerResult = null; S.answered = {}; S.qStartedAt = Date.now();
  S.loading.questions = true; render();
  try {
    const qtype = (S.targetExam && S.targetExam.startsWith('PM')) ? 'multipla_escolha' : 'certo_errado';
    let d = await api(`/api/prf/questions/list?subject_id=${id}&limit=20&question_type=${qtype}`);
    if (!(d.questions || []).length) d = await api(`/api/prf/questions/list?subject_id=${id}&limit=20`);
    S.questions = d.questions || [];
  } catch (e) { toast('Erro ao carregar questões', 'error'); }
  S.loading.questions = false; render(); scrollTop();
}
async function answerQuestion(qid, altId) {
  if (S.answerResult) return;
  const elapsed = S.qStartedAt ? Math.round((Date.now() - S.qStartedAt) / 1000) : null;
  try {
    S.answerResult = await api('/api/prf/questions/answer', {
      method:'POST', json:{ question_id: qid, selected_alternative_id: altId, time_spent_secs: elapsed },
    });
    S.answered[S.qIndex] = S.answerResult.is_correct;
    if (S.answerResult.xp_earned) toast(`+${S.answerResult.xp_earned} XP`, 'xp');
  } catch (e) { toast('Erro ao responder', 'error'); }
  render();
}
function nextQuestion() {
  if (S.qIndex < S.questions.length - 1) {
    S.qIndex++; S.answerResult = null; S.qStartedAt = Date.now(); render(); scrollTop();
  } else if (S.activeMissionIdx != null) {
    toast('Etapa concluída!', 'success');
    finishMissionBlock();
  } else {
    goBack();
  }
}

// Tutor
async function startTutor(qid) {
  const studentAnswer = S.answerResult?.selected_alternative?.text || 'Não sei';
  S.subView = 'tutor'; S.tutorMsgs = []; S.tutorTyping = true; S.tutorConv = null;
  render();
  try {
    const r = await api('/api/prf/tutor/start', {
      method:'POST', json:{ question_id: qid, student_answer: studentAnswer },
    });
    S.tutorConv = r.conversation_id;
    S.tutorMsgs = [{ role:'tutor', text: r.tutor_message }];
  } catch (e) {
    S.tutorMsgs = [{ role:'tutor', text:'Não consegui iniciar a sessão agora. Tente novamente.' }];
  }
  S.tutorTyping = false; render();
}
async function sendTutorMsg() {
  const input = document.getElementById('tutor-input');
  const text = (input?.value || '').trim();
  if (!text || !S.tutorConv) return;
  input.value = '';
  S.tutorMsgs.push({ role:'user', text });
  S.tutorTyping = true; render();
  try {
    const r = await api('/api/prf/tutor/message', {
      method:'POST', json:{ conversation_id: S.tutorConv, message: text },
    });
    S.tutorMsgs.push({ role:'tutor', text: r.tutor_message });
    if (r.resolved) toast('Conceito consolidado', 'success');
  } catch (e) {
    S.tutorMsgs.push({ role:'tutor', text:'Erro de conexão. Tente novamente.' });
  }
  S.tutorTyping = false; render();
}
function closeTutor() { S.subView = 'questions'; render(); }

// Simulado
async function generateSimulado() {
  S.loading.sim = true; render();
  try {
    S.sim = await api('/api/prf/simulados/generate', { method:'POST' });
    const blockNums = Object.keys(S.sim.blocks || {}).map(k => parseInt(k.replace('bloco_', '')));
    S.simBlock = blockNums[0] || 1; S.simAnswers = {}; S.simResult = null;
    S.simIndex = {}; blockNums.forEach(n => S.simIndex[n] = 0);
    S.simSeconds = (S.sim.time_limit_mins || 270) * 60;
    for (const b of blockNums) {
      try {
        const d = await api(`/api/prf/simulados/${S.sim.id}/questions?block=${b}`);
        S.simQuestions[b] = d.questions || [];
      } catch (e) { S.simQuestions[b] = []; }
    }
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      S.simSeconds--;
      const el = document.querySelector('.sim-timer');
      if (el) {
        el.innerHTML = `${I.clock}<span>${fmtTime(S.simSeconds)}</span>`;
        if (S.simSeconds < 600) el.classList.add('danger');
      }
      if (S.simSeconds <= 0) { clearInterval(timerInterval); finishSimulado(); }
    }, 1000);
  } catch (e) { toast('Erro ao gerar simulado', 'error'); }
  S.loading.sim = false; render(); scrollTop();
}
function switchSimBlock(b) { S.simBlock = b; render(); scrollTop(); }
function prevSimQ() { if ((S.simIndex[S.simBlock]||0) > 0) { S.simIndex[S.simBlock]--; render(); scrollTop(); } }
function nextSimQ() {
  const qs = S.simQuestions[S.simBlock] || [];
  if ((S.simIndex[S.simBlock]||0) < qs.length - 1) { S.simIndex[S.simBlock]++; render(); scrollTop(); }
}
async function answerSimQ(qid, sel) {
  S.simAnswers[qid] = sel;
  try { await api(`/api/prf/simulados/${S.sim.id}/answer?question_id=${qid}&selected=${sel}`, { method:'POST' }); }
  catch (e) {}
  render();
  setTimeout(nextSimQ, 280);
}
function confirmFinishSim() { if (confirm('Finalizar a prova? Esta ação não pode ser desfeita.')) finishSimulado(); }
function confirmExitSim() { if (confirm('Sair do simulado? Seu progresso será perdido.')) resetSimulado(); }
async function finishSimulado() {
  clearInterval(timerInterval);
  try { S.simResult = await api(`/api/prf/simulados/${S.sim.id}/finish`, { method:'POST' }); }
  catch (e) { toast('Erro ao finalizar', 'error'); }
  render(); scrollTop();
}
function resetSimulado() {
  clearInterval(timerInterval);
  S.sim = null; S.simQuestions = {}; S.simResult = null; S.simAnswers = {};
  S.simIndex = {}; S.simBlock = 1; S.simSeconds = 0;
  render(); scrollTop();
}

// Audio
async function loadLessons() {
  try { const d = await api('/api/prf/commute/lessons?limit=50'); S.lessons = d.lessons || []; }
  catch (e) { S.lessons = []; toast('Erro ao carregar audiobooks', 'error'); }
  render();
}
async function toggleLesson(id) {
  if (S.playingId === id) { togglePlayPause(); return; }
  S.playingId = id; S.audioPlaying = false; S.audioPos = 0; S.audioDur = 0;
  render();
  toast('Gerando áudio...', 'info');
  try {
    const r = await fetch(`${API}/api/prf/commute/audio/${id}`, {
      headers: { 'Authorization': `Bearer ${S.token}` },
    });
    if (!r.ok) throw new Error('audio fetch failed');
    const blob = await r.blob();
    audioEl.src = URL.createObjectURL(blob);
    await audioEl.play();
    S.audioPlaying = true;
  } catch (e) {
    toast('Áudio indisponível no momento', 'error');
    S.playingId = null;
  }
  render();
}
function togglePlayPause() {
  if (!S.playingId) return;
  if (audioEl.paused) { audioEl.play(); S.audioPlaying = true; }
  else { audioEl.pause(); S.audioPlaying = false; }
  render();
}
function playNextLesson() {
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx >= 0 && idx < lessons.length - 1) toggleLesson(lessons[idx + 1].id);
}
function playPrevLesson() {
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx > 0) toggleLesson(lessons[idx - 1].id);
}
function stopAudio() {
  audioEl.pause(); audioEl.currentTime = 0;
  S.playingId = null; S.audioPlaying = false; S.audioPos = 0; S.audioDur = 0;
  render();
}
function seekAudio(ev) {
  const track = ev.currentTarget;
  const rect = track.getBoundingClientRect();
  const pct = (ev.clientX - rect.left) / rect.width;
  if (isFinite(audioEl.duration)) audioEl.currentTime = pct * audioEl.duration;
}
audioEl.addEventListener('timeupdate', () => {
  S.audioPos = audioEl.currentTime; S.audioDur = audioEl.duration || 0;
  const fill = document.querySelector('.pb-fill');
  const times = document.querySelectorAll('.pb-time');
  if (fill && S.audioDur > 0) fill.style.width = `${(S.audioPos / S.audioDur) * 100}%`;
  if (times[0]) times[0].textContent = fmtTime(S.audioPos);
  if (times[1]) times[1].textContent = fmtTime(S.audioDur);
});
audioEl.addEventListener('ended', () => {
  S.audioPlaying = false;
  const lessons = S.lessons || [];
  const idx = lessons.findIndex(l => l.id === S.playingId);
  if (idx >= 0 && idx < lessons.length - 1) {
    toast('Próxima aula...', 'info');
    toggleLesson(lessons[idx + 1].id);
  } else {
    S.playingId = null;
    toast('Playlist concluída', 'success');
    render();
  }
});

async function listenArticle(text) {
  if (!text) return;
  toast('Gerando áudio...', 'info');
  try {
    const r = await fetch(`${API}/api/prf/commute/synthesize?text=${encodeURIComponent(text.slice(0, 4000))}`, {
      method: 'POST', headers: { 'Authorization': `Bearer ${S.token}` },
    });
    if (!r.ok) throw new Error('tts failed');
    const blob = await r.blob();
    audioEl.src = URL.createObjectURL(blob);
    await audioEl.play();
  } catch (e) { toast('Áudio indisponível', 'error'); }
}

// Reviews
async function loadReviewSummary() {
  try { S.reviewSummary = await api('/api/prf/reviews/summary'); } catch (e) {}
  render();
}
async function openReviews() {
  S.tab = 'more'; S.subView = 'reviews'; S.reviews = null; S.reviewIdx = 0;
  render();
  try { S.reviews = await api('/api/prf/reviews/due?limit=30'); }
  catch (e) { S.reviews = []; }
  render();
}
async function submitReview(cardId, quality) {
  try {
    const r = await api('/api/prf/reviews/submit', {
      method:'POST', json:{ card_id: cardId, quality },
    });
    if (r.xp_earned) toast(`+${r.xp_earned} XP`, 'xp');
  } catch (e) { toast('Erro ao registrar revisão', 'error'); }
  S.reviewIdx++;
  render(); scrollTop();
}

// Legal
function openLegal() {
  S.tab = 'more'; S.subView = 'legal'; render(); scrollTop();
  if (!S.legalDocs) loadLegalDocs();
}
function backToLegalDocs() {
  S.subView = 'legal'; S.searchResults = null; S.searchQ = ''; render(); scrollTop();
}
async function loadLegalDocs() {
  try { S.legalDocs = await api('/api/prf/legal/documents'); }
  catch (e) { S.legalDocs = []; }
  render();
}
async function selectDoc(id, name) {
  S.selDoc = id; S.selDocName = name; S.subView = 'articles';
  S.articles = []; S.loading.articles = true; render();
  try { S.articles = await api(`/api/prf/legal/articles?document_id=${id}&limit=200`) || []; }
  catch (e) { toast('Erro ao carregar artigos', 'error'); }
  S.loading.articles = false; render(); scrollTop();
}
function startLegalSearch() {
  S.subView = 'search'; S.searchResults = null; S.searchQ = ''; render();
  setTimeout(() => document.getElementById('search-input')?.focus(), 100);
}
let searchTimeout;
function debounceLegalSearch(q) {
  S.searchQ = q; clearTimeout(searchTimeout);
  if (q.length < 2) { S.searchResults = null; renderSearchResults(); return; }
  searchTimeout = setTimeout(async () => {
    try { const d = await api(`/api/prf/legal/search?q=${encodeURIComponent(q)}&limit=20`); S.searchResults = d.articles || []; }
    catch (e) { S.searchResults = []; }
    renderSearchResults();
  }, 400);
}
function renderSearchResults() {
  const el = document.getElementById('search-results');
  if (!el) return;
  if (S.searchResults === null) {
    el.innerHTML = `<div class="empty" style="padding-top:40px">${I.search}<h3>Digite para buscar</h3><p>Encontre artigos por palavras-chave.</p></div>`;
  } else if (!S.searchResults.length) {
    el.innerHTML = `<div class="empty">${I.search}<h3>Sem resultados</h3><p>Tente outra palavra-chave.</p></div>`;
  } else {
    el.innerHTML = S.searchResults.map(a => `<div class="legal-article">
      <div class="art-num">${esc(a.document_name||'')} · Art. ${esc(a.article_number||'?')}</div>
      ${a.title ? `<div class="art-title">${esc(a.title)}</div>` : ''}
      <div class="art-text">${esc(a.official_text || a.simple_text || '')}</div>
    </div>`).join('');
  }
}

// Trilha
function openTrilha() {
  S.tab = 'more'; S.subView = 'trilha'; render(); scrollTop();
  loadTrilha();
}
async function loadTrilha() {
  try { S.trilha = await api(`/api/prf/trilha?exam=${S.targetExam}`); }
  catch (e) { S.trilha = { coverage:0, subjects:[], topics_total:0, topics_done:0 }; }
  render();
}
function viewTrilha() {
  const head = `<div class="topbar-sub"><button class="back-btn" onclick="goBack()">${I.back}</button><span class="title-sub">Trilha do edital</span></div>`;
  if (!S.trilha) return head + skeletonBlock(4, 60);
  const t = S.trilha;
  const pct = (t.coverage || 0).toFixed(1);
  const pctColor = pct >= 70 ? 'var(--success)' : pct >= 30 ? 'var(--warning)' : 'var(--primary)';
  return head + `
    <div class="trilha-overall fade-in">
      <div>
        <div class="big-pct" style="color:${pctColor}">${pct}%</div>
        <div class="big-label">cobertura</div>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--ink-2)">${t.topics_done || 0} de ${t.topics_total || 0} tópicos dominados</div>
        ${t.days_left ? `<div style="font-size:12px;color:var(--ink-3);margin-top:4px">${t.days_left} dias até a prova</div>` : ''}
        ${t.topics_per_week_needed ? `<div style="font-size:12px;color:var(--warning);margin-top:2px">${t.topics_per_week_needed} tópicos/semana necessários</div>` : ''}
      </div>
    </div>
    <div class="section-eyebrow" style="padding:8px 20px">${S.targetExam} · ${(t.subjects||[]).length} matérias</div>
    ${(t.subjects||[]).map((s, si) => {
      const sPct = (s.coverage||0).toFixed(0);
      const sColor = s.color || 'var(--primary)';
      return `<div class="trilha-subject" id="trilha-s-${si}">
        <div class="trilha-subject-header" onclick="toggleTrilhaSubject(${si})">
          <div class="subj-color" style="background:${sColor}"></div>
          <div class="subj-info">
            <h3>${esc(s.name)}</h3>
            <span class="subj-meta">${s.topics_done||0}/${s.topics_total||0} tópicos · peso ${s.weight||0}</span>
          </div>
          <div class="subj-pct" style="color:${sPct>=70?'var(--success)':sPct>0?'var(--warning)':'var(--ink-3)'}">${sPct}%</div>
        </div>
        <div class="trilha-topics">${(s.topics||[]).map(tp => `
          <div class="trilha-topic">
            <div class="t-dot ${tp.status}"></div>
            <div class="t-name">${esc(tp.name)}</div>
            <div class="t-pct">${(tp.coverage||0).toFixed(0)}%</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('')}`;
}
function toggleTrilhaSubject(i) {
  const el = document.getElementById(`trilha-s-${i}`);
  if (el) el.classList.toggle('open');
}

// Settings
function openSettings() {
  S.tab = 'more'; S.subView = 'settings'; render(); scrollTop();
}
function viewSettings() {
  return `<div class="topbar-sub"><button class="back-btn" onclick="goBack()">${I.back}</button><span class="title-sub">Meu concurso</span></div>
    <div class="settings-section fade-in">
      <div class="section-eyebrow">Qual concurso você estuda?</div>
      <div class="exam-toggle">
        <button class="${S.targetExam==='PRF'?'active':''}" onclick="setExam('PRF')">PRF</button>
        <button class="${S.targetExam==='PMGO'?'active':''}" onclick="setExam('PMGO')">PMGO</button>
      </div>
      <p style="font-size:13px;color:var(--ink-3);line-height:1.5">
        ${S.targetExam === 'PMGO'
          ? 'Banca: Instituto AOCP (2022). Inclui Dir. Penal Militar, Processual Penal Militar, Legislação Institucional PM, Criminologia e Medicina Legal. Exclui matérias exclusivas PRF.'
          : 'Banca: CEBRASPE. Trilha focada nas matérias do edital da PRF, com pesos do certame.'}
      </p>
    </div>`;
}
async function setExam(exam) {
  S.targetExam = exam;
  localStorage.setItem('prf_target_exam', exam);
  S.trilha = null;
  S.subjects = null;
  render();
  try {
    await api('/api/prf/onboarding/target-exam', {
      method:'PATCH', json:{ target_exam: exam },
    });
  } catch (e) {}
  loadSubjects();
  toast(exam === 'PMGO' ? 'Trilha PMGO ativada — banca Instituto AOCP' : 'Trilha PRF ativada — banca CEBRASPE', 'success');
}

// Essays
function openEssays() {
  S.tab = 'more'; S.subView = 'essays'; S.essayResult = null; render(); scrollTop();
  if (!S.themes) loadThemes();
}
function backToThemes() { S.subView = 'essays'; render(); scrollTop(); }
async function loadThemes() {
  try { const d = await api('/api/prf/essays/themes'); S.themes = d.themes || d; }
  catch (e) { S.themes = []; }
  render();
}
function selectTheme(id) {
  S.selTheme = (S.themes || []).find(t => t.id === id);
  S.subView = 'essay-write'; S.essayText = ''; S.essayResult = null;
  render(); scrollTop();
}
function updateEssayCounter() {
  const lines = (S.essayText||'').split('\n').length;
  const over = lines > 30;
  const lc = document.getElementById('line-count');
  const cc = document.getElementById('char-count');
  const lt = document.getElementById('line-count-top');
  if (lc) { lc.textContent = lines; lc.classList.toggle('over', over); }
  if (cc) cc.textContent = (S.essayText||'').length;
  if (lt) { lt.textContent = lines; lt.classList.toggle('over', over); }
}
async function submitEssay() {
  if (!S.essayText?.trim()) { toast('Escreva sua redação antes de enviar', 'error'); return; }
  S.loading.essay = true; render();
  try {
    const form = new FormData();
    form.append('theme_title', S.selTheme.title);
    form.append('text', S.essayText);
    S.essayResult = await apiForm('/api/prf/essays/submit', form);
    S.subView = 'essays';
  } catch (e) { toast('Erro na correção. Tente novamente.', 'error'); }
  S.loading.essay = false; render(); scrollTop();
}
function resetEssay() { S.essayResult = null; S.subView = 'essays'; S.essayText = ''; render(); scrollTop(); }

// ===== INIT =====
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (S.theme === 'auto') applyTheme();
});

async function init() {
  try { await ensureAuth(); }
  catch (e) {
    toast('Erro de conexão. Tentando novamente...', 'error');
    setTimeout(init, 3000); return;
  }
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => document.getElementById('splash')?.remove(), 400);
  render();
  loadDashboard();
  loadSubjects();

  // O service worker serve o app offline e recebe os lembretes. Registrar
  // depois da primeira renderização evita competir com o carregamento inicial;
  // a permissão de notificação continua só sendo pedida quando o usuário
  // ativa os lembretes em Mais.
  registrarSW().then(async () => {
    await sincronizarPush();
    if (S.pushOn) render();
  });
}
init();
</script>
