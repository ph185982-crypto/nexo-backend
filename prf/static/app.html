<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
<title>Estudo PMGO</title>
<link rel="manifest" href="/manifest.json">
<!-- O iOS ignora os ícones do manifest: quem manda no ícone da tela de
     início é o apple-touch-icon, e ele precisa ser PNG. -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Estudo PMGO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #FBFAF7; --surface: #FFFFFF; --surface-2: #F3F0E9; --surface-3: #E9E5DC;
  --border: rgba(23,22,20,.09); --border-strong: rgba(23,22,20,.15);
  --ink: #171614; --ink-2: #4A4842; --ink-3: #78756D;
  --primary: #2D4CC8; --primary-hover: #1E3AA8;
  --primary-soft: rgba(45,76,200,.08); --primary-tint: rgba(45,76,200,.14);
  --success: #1B7A4A; --success-soft: rgba(27,122,74,.08);
  --error: #B93318; --error-soft: rgba(185,51,24,.08);
  --accent: #D97757; --accent-soft: rgba(217,119,87,.12);
  --gold: #B0842A; --gold-soft: rgba(176,132,42,.14);
  --shadow-sm: 0 1px 2px rgba(23,22,20,.05);
  --shadow-md: 0 4px 12px rgba(23,22,20,.08);
  --shadow-lg: 0 12px 32px rgba(23,22,20,.12);
  --serif: 'Iowan Old Style','Charter','Georgia','Cambria',serif;
  --sans: -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono: 'SF Mono',ui-monospace,'Menlo','Consolas',monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-full: 999px;
  --nav-h: 72px;
  --safe-b: env(safe-area-inset-bottom,0px); --safe-t: env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0F0E0C; --surface:#1A1917; --surface-2:#24221E; --surface-3:#302D27;
    --border:rgba(245,242,236,.08); --border-strong:rgba(245,242,236,.16);
    --ink:#F5F2EC; --ink-2:#B5B0A8; --ink-3:#7A756D;
    --primary:#7B96F5; --primary-hover:#96AEF9;
    --primary-soft:rgba(123,150,245,.10); --primary-tint:rgba(123,150,245,.18);
    --success:#5FCC8F; --success-soft:rgba(95,204,143,.10);
    --error:#E88370; --error-soft:rgba(232,131,112,.10);
    --accent:#EA9878; --accent-soft:rgba(234,152,120,.14);
    --gold:#E0B558; --gold-soft:rgba(224,181,88,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.25); --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:#0F0E0C; --surface:#1A1917; --surface-2:#24221E; --surface-3:#302D27;
  --border:rgba(245,242,236,.08); --border-strong:rgba(245,242,236,.16);
  --ink:#F5F2EC; --ink-2:#B5B0A8; --ink-3:#7A756D;
  --primary:#7B96F5; --primary-hover:#96AEF9;
  --primary-soft:rgba(123,150,245,.10); --primary-tint:rgba(123,150,245,.18);
  --success:#5FCC8F; --success-soft:rgba(95,204,143,.10);
  --error:#E88370; --error-soft:rgba(232,131,112,.10);
  --accent:#EA9878; --accent-soft:rgba(234,152,120,.14);
  --gold:#E0B558; --gold-soft:rgba(224,181,88,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25); --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}

/* ── PMGO exam theme (teal/blue-green identity — Instituto AOCP) ─────── */
:root[data-exam="PMGO"] {
  --primary: #0D7A6B; --primary-hover: #096059;
  --primary-soft: rgba(13,122,107,.08); --primary-tint: rgba(13,122,107,.14);
  --accent: #2A9D6E; --accent-soft: rgba(42,157,110,.12);
  --gold: #1A7A5A; --gold-soft: rgba(26,122,90,.14);
}
@media (prefers-color-scheme: dark) {
  :root[data-exam="PMGO"]:not([data-theme="light"]) {
    --primary: #4ECDB4; --primary-hover: #6DD9C4;
    --primary-soft: rgba(78,205,180,.10); --primary-tint: rgba(78,205,180,.18);
    --accent: #56D4A0; --accent-soft: rgba(86,212,160,.14);
    --gold: #40C898; --gold-soft: rgba(64,200,152,.14);
  }
}
:root[data-exam="PMGO"][data-theme="dark"] {
  --primary: #4ECDB4; --primary-hover: #6DD9C4;
  --primary-soft: rgba(78,205,180,.10); --primary-tint: rgba(78,205,180,.18);
  --accent: #56D4A0; --accent-soft: rgba(86,212,160,.14);
  --gold: #40C898; --gold-soft: rgba(64,200,152,.14);
}
:root[data-exam="PMGO"][data-theme="light"] {
  --primary: #0D7A6B; --primary-hover: #096059;
  --primary-soft: rgba(13,122,107,.08); --primary-tint: rgba(13,122,107,.14);
  --accent: #2A9D6E; --accent-soft: rgba(42,157,110,.12);
  --gold: #1A7A5A; --gold-soft: rgba(26,122,90,.14);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
html,body { height:100%; overflow:hidden; }
body {
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent; user-select:none;
  transition:background-color .3s ease,color .3s ease; letter-spacing:-.01em;
}
input,textarea { user-select:text; }
button { font-family:inherit; }
#app { height:100%; display:flex; flex-direction:column; }
.content {
  flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
}
.content::-webkit-scrollbar { display:none; }
.px { padding-left:20px; padding-right:20px; }

.appbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 20px 10px; background:var(--bg);
  position:sticky; top:0; z-index:40; border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.appbar.scrolled { border-bottom-color:var(--border); }
.appbar .brand { font-family:var(--serif); font-size:20px; letter-spacing:-.02em; }
.appbar .brand em { font-style:italic; color:var(--accent); }
.icon-btn {
  width:40px; height:40px; border-radius:var(--r-full); background:transparent;
  border:1px solid var(--border); color:var(--ink-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.icon-btn:hover { background:var(--surface-2); color:var(--ink); }
.icon-btn:active { transform:scale(.94); }
.icon-btn svg { width:18px; height:18px; }

.topbar-sub {
  display:flex; align-items:center; gap:12px;
  padding:calc(var(--safe-t) + 14px) 20px 12px; background:var(--bg);
  position:sticky; top:0; z-index:40; border-bottom:1px solid var(--border);
}
.topbar-sub .back-btn {
  background:transparent; border:none; color:var(--ink); cursor:pointer;
  padding:4px; display:flex; border-radius:var(--r-sm);
}
.topbar-sub .back-btn:hover { background:var(--surface-2); }
.topbar-sub .title-sub { font-family:var(--serif); font-size:18px; font-weight:500; }
.topbar-sub .meta-sub {
  margin-left:auto; font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; font-family:var(--mono);
}

.display-hero {
  font-family:var(--serif); font-size:clamp(34px,9vw,42px); font-weight:400;
  line-height:1.1; letter-spacing:-.02em;
}
.display-hero em { font-style:italic; color:var(--accent); }
.section-eyebrow {
  font-size:11px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--ink-3); font-weight:700; margin-bottom:8px;
}
.section-title { font-family:var(--serif); font-size:22px; font-weight:500; letter-spacing:-.01em; }

.hero-block { padding:24px 20px 20px; }
.hero-block .greeting-eyebrow {
  font-size:11px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.14em; font-weight:700; margin-bottom:12px;
}
.hero-block .greeting-line {
  font-family:var(--serif); font-size:34px; line-height:1.1;
  letter-spacing:-.02em; margin-bottom:12px;
}
.hero-block .greeting-line em { font-style:italic; color:var(--accent); }
.chip-row { display:flex; gap:8px; flex-wrap:wrap; }

.stat-row {
  display:grid; grid-template-columns:repeat(3,1fr);
  padding:4px 20px 20px; border-bottom:1px solid var(--border);
}
.stat-cell { padding:14px 8px; border-right:1px solid var(--border); }
.stat-cell:last-child { border-right:none; }
.stat-cell:first-child { padding-left:0; }
.stat-cell .stat-eyebrow {
  font-size:10px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.12em; font-weight:700; margin-bottom:6px;
}
.stat-cell .stat-num {
  font-family:var(--serif); font-size:32px; line-height:1;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums;
}
.stat-cell .stat-num-sm { font-size:13px; color:var(--ink-3); margin-left:2px; }

.approval-block { padding:24px 20px; border-bottom:1px solid var(--border); }
.approval-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; }
.approval-head .lbl {
  font-size:11px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.14em; font-weight:700;
}
.approval-head .val {
  font-family:var(--serif); font-size:40px; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1;
}
.approval-head .val .pct { font-size:20px; color:var(--ink-3); }
.meter-track { height:6px; background:var(--surface-2); border-radius:var(--r-full); overflow:hidden; }
.meter-fill {
  height:100%; border-radius:var(--r-full);
  transition:width 1s cubic-bezier(.22,1,.36,1);
  background:linear-gradient(90deg,var(--primary),var(--accent));
}
.approval-foot { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--ink-3); }

.risk-block { padding:20px; border-bottom:1px solid var(--border); background:var(--error-soft); }
.risk-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; }
.risk-head .lbl { font-size:13px; color:var(--ink-2); max-width:60%; line-height:1.4; }
.risk-val { font-family:var(--serif); font-size:28px; color:var(--error); font-variant-numeric:tabular-nums; }
.risk-val .risk-unit { font-size:13px; color:var(--ink-3); font-family:var(--sans); }
.risk-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.risk-chip {
  display:flex; align-items:center; gap:6px; padding:6px 10px;
  background:var(--surface); border-radius:var(--r-full); border:1px solid var(--border);
  font-size:12px;
}
.risk-chip .rc-pts { font-weight:700; color:var(--error); font-variant-numeric:tabular-nums; }
.risk-chip .rc-name { color:var(--ink-2); }

.week-block { padding:24px 20px; border-bottom:1px solid var(--border); }
.week-chart { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:90px; margin-top:20px; }
.week-col { display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.week-bar { width:100%; max-width:28px; border-radius:4px 4px 0 0; min-height:3px; background:var(--primary-tint); transition:height .6s cubic-bezier(.22,1,.36,1); }
.week-bar.active { background:var(--primary); }
.week-bar.done { background:var(--success); }
.week-day { font-size:10px; color:var(--ink-3); font-weight:700; text-transform:uppercase; }
.week-day.today { color:var(--ink); }

.shortcuts-block { padding:24px 20px 8px; }
.shortcut-list { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
.shortcut {
  display:flex; align-items:center; gap:14px; padding:16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); cursor:pointer; transition:all .15s;
}
.shortcut:hover { border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow-md); }
.shortcut:active { transform:scale(.98); }
.shortcut .badge-icon {
  width:44px; height:44px; border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:var(--primary-soft); color:var(--primary);
}
.shortcut .badge-icon svg { width:22px; height:22px; }
.shortcut .badge-icon.accent { background:var(--accent-soft); color:var(--accent); }
.shortcut .badge-icon.success { background:var(--success-soft); color:var(--success); }
.shortcut .badge-icon.gold { background:var(--gold-soft); color:var(--gold); }
.shortcut .info { flex:1; min-width:0; }
.shortcut .info h3 { font-family:var(--serif); font-size:17px; font-weight:500; margin-bottom:2px; }
.shortcut .info p { font-size:12.5px; color:var(--ink-3); line-height:1.4; }
.shortcut .chev { color:var(--ink-3); flex-shrink:0; }
.shortcut .chev svg { width:18px; height:18px; }
.shortcut .count-badge {
  background:var(--error); color:#fff; font-size:11px; font-weight:700;
  padding:2px 8px; border-radius:var(--r-full); font-variant-numeric:tabular-nums;
}

.nav {
  display:flex; align-items:stretch; height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b); border-top:1px solid var(--border);
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  background:var(--surface);
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; border:none; background:none; color:var(--ink-3);
  font-size:10.5px; font-weight:600; cursor:pointer; transition:color .2s;
  padding:8px 4px 6px; position:relative;
}
.nav-item.active { color:var(--ink); }
.nav-item.active::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:24px; height:3px; background:var(--primary); border-radius:0 0 3px 3px;
}
.nav-item:active { transform:scale(.94); }
.nav-item svg { width:22px; height:22px; stroke-width:1.6; }
.nav-item.active svg { stroke-width:2; }

.subject-list { display:flex; flex-direction:column; gap:8px; padding:8px 20px 20px; }
.subject-item {
  display:flex; align-items:center; gap:14px; padding:16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); cursor:pointer; transition:all .15s;
}
.subject-item:hover { border-color:var(--border-strong); }
.subject-item:active { transform:scale(.98); }
.subject-item .subj-color { width:4px; height:32px; border-radius:2px; flex-shrink:0; }
.subject-item .subj-info { flex:1; min-width:0; }
.subject-item .subj-name { font-family:var(--serif); font-size:16px; font-weight:500; margin-bottom:3px; }
.subject-item .subj-desc { font-size:12px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.subject-item .subj-weight {
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
  background:var(--surface-2); padding:3px 8px; border-radius:var(--r-sm);
  font-weight:600; flex-shrink:0;
}

.q-container { padding:16px 20px; }
.q-progress { display:flex; gap:3px; margin-bottom:20px; }
.q-progress-dot { flex:1; height:3px; border-radius:var(--r-full); background:var(--surface-2); transition:background .3s; }
.q-progress-dot.done { background:var(--success); }
.q-progress-dot.current { background:var(--primary); }
.q-progress-dot.wrong { background:var(--error); }
.q-source-tag {
  display:inline-block; font-family:var(--mono); font-size:10.5px;
  color:var(--ink-3); background:var(--surface-2); padding:4px 8px;
  border-radius:var(--r-sm); margin-bottom:14px; font-weight:600;
}
.q-context {
  font-size:14px; line-height:1.7; color:var(--ink-2); padding:14px 16px;
  background:var(--surface-2); border-left:3px solid var(--accent);
  border-radius:0 var(--r-md) var(--r-md) 0; margin-bottom:20px;
  font-family:var(--serif); font-style:italic;
}
.q-text { font-size:16.5px; line-height:1.65; margin-bottom:24px; }
.q-choices { display:flex; flex-direction:column; gap:10px; }
.q-choice {
  display:flex; align-items:center; gap:14px; padding:16px 18px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--r-md); color:var(--ink); font-size:15px; font-weight:500;
  cursor:pointer; transition:all .15s; text-align:left; width:100%;
}
@media (hover: hover) { .q-choice:hover:not(:disabled) { border-color:var(--primary); background:var(--primary-soft); } }
.q-choice:active:not(:disabled) { transform:scale(.98); border-color:var(--primary); background:var(--primary-soft); }
.q-choice .letter {
  width:32px; height:32px; border-radius:var(--r-sm); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:15px; font-weight:500;
  color:var(--ink-2); flex-shrink:0; transition:all .2s;
}
.q-choice.correct { border-color:var(--success); background:var(--success-soft); color:var(--success); }
.q-choice.correct .letter { background:var(--success); color:#fff; }
.q-choice.wrong { border-color:var(--error); background:var(--error-soft); color:var(--error); }
.q-choice.wrong .letter { background:var(--error); color:#fff; }
.q-choice.correct-highlight { border-color:var(--success); background:var(--success-soft); }
.q-choice.correct-highlight .letter { background:var(--success); color:#fff; }
.q-choice:disabled { cursor:default; }

.q-feedback { margin-top:22px; padding:18px; border-radius:var(--r-md); animation:slideUp .35s cubic-bezier(.22,1,.36,1); }
.q-feedback.correct { background:var(--success-soft); border:1px solid rgba(27,122,74,.15); }
.q-feedback.wrong { background:var(--error-soft); border:1px solid rgba(185,51,24,.15); }
.q-feedback .fb-title { font-family:var(--serif); font-size:18px; font-weight:500; margin-bottom:10px; }
.q-feedback.correct .fb-title { color:var(--success); }
.q-feedback.wrong .fb-title { color:var(--error); }
.q-feedback .fb-body { font-size:14px; line-height:1.6; color:var(--ink); }
.q-feedback .fb-legal {
  margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
  font-size:12.5px; color:var(--ink-2); line-height:1.6;
}
.q-feedback .fb-legal strong { color:var(--ink); font-weight:600; }
.q-feedback .fb-xp {
  display:inline-flex; align-items:center; gap:4px; margin-top:10px;
  padding:4px 10px; border-radius:var(--r-full); background:var(--gold-soft);
  color:var(--gold); font-size:12px; font-weight:700;
}

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border:none; border-radius:var(--r-md);
  font-size:14.5px; font-weight:600; cursor:pointer; transition:all .15s;
  font-family:inherit;
}
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover:not(:disabled) { background:var(--primary-hover); }
.btn-outline { background:transparent; color:var(--ink); border:1.5px solid var(--border-strong); }
.btn-outline:hover { background:var(--surface-2); border-color:var(--ink); }
.btn-ghost { background:transparent; color:var(--ink-2); padding:10px 14px; }
.btn-ghost:hover { background:var(--surface-2); color:var(--ink); }
.btn-danger { background:var(--error); color:#fff; }
.btn-lg { padding:16px 28px; font-size:15.5px; }
.btn-sm { padding:8px 14px; font-size:12.5px; }
.btn-full { width:100%; }

.sim-intro { padding:24px 20px; }
.sim-intro .sim-headline { font-family:var(--serif); font-size:40px; line-height:1.05; letter-spacing:-.02em; margin-bottom:12px; }
.sim-intro .sim-headline em { font-style:italic; color:var(--accent); }
.sim-intro .sim-desc { font-size:15px; line-height:1.6; color:var(--ink-2); margin-bottom:28px; }
.sim-spec { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); margin-bottom:24px; overflow:hidden; }
.sim-spec-row { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
.sim-spec-row:last-child { border-bottom:none; }
.sim-spec-row .lbl { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-2); }
.sim-spec-row .lbl svg { width:16px; height:16px; color:var(--ink-3); }
.sim-spec-row .val { font-family:var(--serif); font-size:15px; font-weight:500; }
.sim-blocks-preview { display:grid; gap:10px; margin-bottom:24px; }
.sim-block-preview { padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); }
.sim-block-preview .bl-head { display:flex; justify-content:space-between; margin-bottom:4px; }
.sim-block-preview .bl-name { font-family:var(--serif); font-size:15px; font-weight:500; }
.sim-block-preview .bl-count { font-family:var(--mono); font-size:12px; color:var(--primary); font-weight:600; }
.sim-block-preview .bl-desc { font-size:12px; color:var(--ink-3); line-height:1.4; }

.sim-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(var(--safe-t) + 12px) 20px 12px; background:var(--bg);
  position:sticky; top:0; z-index:40; border-bottom:1px solid var(--border);
}
.sim-header .sim-close { background:transparent; border:none; color:var(--ink); padding:4px; cursor:pointer; }
.sim-timer {
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
  background:var(--surface-2); border-radius:var(--r-full);
  font-family:var(--mono); font-size:14px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.sim-timer.danger { background:var(--error-soft); color:var(--error); }
.sim-timer svg { width:14px; height:14px; }
.sim-header .sim-count { font-family:var(--mono); font-size:12px; color:var(--ink-3); font-weight:600; }

.segmented { display:flex; padding:4px; background:var(--surface-2); border-radius:var(--r-md); margin:12px 20px 16px; gap:2px; }
.segmented-item {
  flex:1; padding:10px 4px; background:transparent; border:none; border-radius:8px;
  font-size:12.5px; font-weight:600; color:var(--ink-3); cursor:pointer;
  transition:all .2s; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.segmented-item.active { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
.segmented-item .seg-count { font-size:10px; color:var(--ink-3); font-family:var(--mono); }
.segmented-item.active .seg-count { color:var(--primary); }

.sim-q-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 20px 16px; }
.sim-q-idx { font-family:var(--serif); font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.sim-actions { display:flex; gap:10px; padding:24px 20px; }
.sim-actions .btn { flex:1; }

.sim-result { padding:24px 20px; }
.sim-result .verdict {
  padding:28px 20px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-xl); text-align:center; margin-bottom:20px;
}
.sim-result .verdict .verdict-lbl {
  font-size:11px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.14em; font-weight:700; margin-bottom:10px;
}
.sim-result .verdict .verdict-num {
  font-family:var(--serif); font-size:72px; letter-spacing:-.03em;
  line-height:1; font-variant-numeric:tabular-nums;
}
.sim-result .verdict.pass .verdict-num { color:var(--success); }
.sim-result .verdict.fail .verdict-num { color:var(--error); }
.sim-result .verdict .verdict-scale { font-size:13px; color:var(--ink-3); margin-top:6px; }
.sim-result .verdict .badge {
  display:inline-block; margin-top:16px; padding:8px 16px;
  border-radius:var(--r-full); font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
}
.sim-result .verdict.pass .badge { background:var(--success-soft); color:var(--success); }
.sim-result .verdict.fail .badge { background:var(--error-soft); color:var(--error); }
.sim-summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
.sim-summary-cell { padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); }
.sim-summary-cell .lbl { font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:6px; }
.sim-summary-cell .val { font-family:var(--serif); font-size:26px; letter-spacing:-.015em; font-variant-numeric:tabular-nums; }
.sim-block-result { padding:18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:10px; }
.sim-block-result .br-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.sim-block-result .br-name { font-family:var(--serif); font-size:16px; font-weight:500; }
.sim-block-result .br-score { font-family:var(--serif); font-size:22px; font-variant-numeric:tabular-nums; }
.sim-block-result .br-score.neg { color:var(--error); }
.sim-block-result .br-score.pos { color:var(--success); }
.sim-block-result .br-detail { display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3); }
.sim-block-result .br-detail strong { color:var(--ink-2); font-weight:600; }

/* ── AUDIO ── */
.audio-hero { padding:24px 20px 20px; }
.pod-sub { font-size:13px; color:var(--ink-3); line-height:1.5; margin-top:8px; max-width:46ch; }
.pod-list { padding:0 20px 8px; display:flex; flex-direction:column; gap:10px; }
.pod-group { margin-bottom:18px; }
.pod-group-head {
  display:flex; justify-content:space-between; align-items:baseline;
  padding:0 20px 10px; gap:10px;
}
.pod-group-name {
  font-size:11px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--primary);
}
.pod-group-count { font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.pod-card {
  display:flex; align-items:center; gap:14px; padding:16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); cursor:pointer; transition:border-color .15s, transform .1s;
}
.pod-card:active { transform:scale(.98); }
.pod-card.playing { border-color:var(--primary); background:var(--primary-soft); }
.pod-play {
  width:42px; height:42px; flex-shrink:0; border-radius:var(--r-full);
  display:flex; align-items:center; justify-content:center;
  background:var(--primary); color:#fff;
}
.pod-play svg { width:18px; height:18px; }
.pod-info { min-width:0; flex:1; }
.pod-title { font-family:var(--serif); font-size:16px; font-weight:500; line-height:1.35; }
.pod-meta { display:flex; flex-wrap:wrap; gap:5px; align-items:center; font-size:12px; color:var(--ink-3); margin-top:5px; }
.pod-meta .pod-dur { font-variant-numeric:tabular-nums; font-weight:600; color:var(--primary); }
.pod-progress { font-size:11px; color:var(--primary); font-weight:600; margin-top:6px; }
.audio-list { padding:8px 20px 20px; display:flex; flex-direction:column; gap:10px; }
.audio-item {
  display:flex; align-items:center; gap:14px; padding:16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); cursor:pointer; transition:all .15s;
}
.audio-item:hover { border-color:var(--border-strong); }
.audio-item:active { transform:scale(.98); }
.audio-item.playing { border-color:var(--primary); background:var(--primary-soft); }
.audio-item .play-icon {
  width:44px; height:44px; border-radius:var(--r-full); flex-shrink:0;
  background:var(--primary-soft); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
}
.audio-item.playing .play-icon { background:var(--primary); color:#fff; }
.audio-item .play-icon svg { width:18px; height:18px; }
.audio-item .a-info { flex:1; min-width:0; }
.audio-item .a-title { font-family:var(--serif); font-size:16px; font-weight:500; margin-bottom:3px; line-height:1.3; }
.audio-item .a-meta { font-size:12px; color:var(--ink-3); display:flex; gap:8px; align-items:center; }
.audio-item .a-dur { font-family:var(--mono); font-size:11px; }

.player-bar {
  position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + var(--safe-b));
  background:var(--surface); border-top:1px solid var(--border);
  padding:12px 20px; z-index:90; box-shadow:var(--shadow-lg);
  animation:slideUpBar .3s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUpBar { from { transform:translateY(100%); } to { transform:translateY(0); } }
.player-bar .pb-top { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.player-bar .pb-title { flex:1; min-width:0; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:baseline; gap:6px; }
.player-bar .pb-pos { font-size:10px; color:var(--ink-3); font-weight:400; font-variant-numeric:tabular-nums; flex-shrink:0; }
.player-bar .pb-btn:disabled { opacity:.3; cursor:default; }
.player-bar .pb-btn {
  width:38px; height:38px; border-radius:var(--r-full); border:none;
  background:var(--primary); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.player-bar .pb-btn:active { transform:scale(.92); }
.player-bar .pb-btn svg { width:16px; height:16px; }
.player-bar .pb-btn.ghost { background:transparent; color:var(--ink-3); }
.player-bar .pb-progress { display:flex; align-items:center; gap:8px; }
.player-bar .pb-time { font-family:var(--mono); font-size:10px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:34px; }
.player-bar .pb-track { flex:1; height:4px; background:var(--surface-2); border-radius:var(--r-full); cursor:pointer; position:relative; }
.player-bar .pb-fill { height:100%; background:var(--primary); border-radius:var(--r-full); transition:width .2s linear; }

/* ── REVIEWS ── */
.review-card {
  margin:16px 20px; padding:24px 20px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-lg); text-align:center;
}
.review-card .rc-subject { font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin-bottom:14px; }
.review-card .rc-content { font-family:var(--serif); font-size:19px; line-height:1.55; margin-bottom:8px; }
.review-card .rc-meta { font-size:11px; color:var(--ink-3); font-family:var(--mono); margin-top:14px; }
.quality-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 20px 20px; }
.quality-btn {
  padding:14px 10px; border-radius:var(--r-md); border:1.5px solid var(--border);
  background:var(--surface); cursor:pointer; transition:all .15s;
  display:flex; flex-direction:column; align-items:center; gap:4px; font-family:inherit;
}
.quality-btn:active { transform:scale(.96); }
.quality-btn .qb-label { font-size:13px; font-weight:600; color:var(--ink); }
.quality-btn .qb-hint { font-size:10px; color:var(--ink-3); }
.quality-btn[data-q="blackout"]:hover,.quality-btn[data-q="wrong"]:hover { border-color:var(--error); background:var(--error-soft); }
.quality-btn[data-q="hard"]:hover { border-color:var(--gold); background:var(--gold-soft); }
.quality-btn[data-q="good"]:hover,.quality-btn[data-q="easy"]:hover { border-color:var(--success); background:var(--success-soft); }

/* ── TUTOR CHAT ── */
.chat-wrap { padding:16px 20px 20px; display:flex; flex-direction:column; gap:12px; }
.bubble { max-width:85%; padding:14px 16px; border-radius:var(--r-lg); font-size:14.5px; line-height:1.6; animation:slideUp .3s ease; }
.bubble.tutor { background:var(--surface); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px; }
.bubble.user { background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.bubble.typing { color:var(--ink-3); font-style:italic; }
.chat-input-row {
  display:flex; gap:8px; padding:12px 20px calc(var(--nav-h) + var(--safe-b) + 12px);
  position:fixed; bottom:0; left:0; right:0; background:var(--bg);
  border-top:1px solid var(--border); z-index:50;
}
.chat-input-row input {
  flex:1; padding:12px 16px; border-radius:var(--r-full);
  border:1.5px solid var(--border); background:var(--surface);
  color:var(--ink); font-size:14.5px; font-family:inherit; outline:none;
}
.chat-input-row input:focus { border-color:var(--primary); }
.chat-input-row .send-btn {
  width:44px; height:44px; border-radius:var(--r-full); border:none;
  background:var(--primary); color:#fff; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.chat-input-row .send-btn:active { transform:scale(.92); }
.chat-input-row .send-btn svg { width:18px; height:18px; }

/* ── LEGAL ── */
.legal-hero { padding:24px 20px 20px; }
.search-box {
  display:flex; align-items:center; gap:10px; margin:4px 20px 20px;
  padding:12px 14px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); transition:border-color .2s;
}
.search-box:focus-within { border-color:var(--primary); }
.search-box svg { width:18px; height:18px; color:var(--ink-3); flex-shrink:0; }
.search-box input { flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:14.5px; font-family:inherit; }
.search-box input::placeholder { color:var(--ink-3); }
.legal-doc {
  display:flex; align-items:center; gap:14px; padding:16px 20px;
  cursor:pointer; border-bottom:1px solid var(--border); transition:background .15s;
}
.legal-doc:hover { background:var(--surface-2); }
.legal-doc .abbr-tag {
  padding:8px 10px; border-radius:var(--r-sm); background:var(--primary-soft);
  color:var(--primary); font-family:var(--mono); font-size:11px; font-weight:700;
  min-width:60px; text-align:center; flex-shrink:0;
}
.legal-doc .info { flex:1; min-width:0; }
.legal-doc .info h3 { font-family:var(--serif); font-size:16px; font-weight:500; margin-bottom:2px; }
.legal-doc .info p { font-size:12px; color:var(--ink-3); }
.legal-doc .chev { color:var(--ink-3); flex-shrink:0; }
.legal-article { padding:20px; border-bottom:1px solid var(--border); }
.legal-article .art-num { font-family:var(--serif); font-size:15px; font-weight:500; color:var(--primary); margin-bottom:8px; }
.legal-article .art-title { font-family:var(--serif); font-size:14px; font-weight:500; margin-bottom:8px; line-height:1.4; }
.legal-article .art-text { font-size:14px; line-height:1.65; color:var(--ink-2); }
.legal-article .art-simple {
  margin-top:12px; padding:12px 14px; background:var(--success-soft);
  border-left:3px solid var(--success); border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:13px; line-height:1.6; color:var(--ink); display:none;
}
.legal-article.expanded .art-simple { display:block; animation:slideUp .3s ease; }
.legal-article .art-actions { margin-top:10px; display:flex; gap:14px; align-items:center; }
.legal-article .art-toggle { font-size:12px; color:var(--primary); font-weight:600; cursor:pointer; }
.legal-article .art-listen { font-size:12px; color:var(--accent); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
.legal-article .art-listen svg { width:13px; height:13px; }

/* ── MISSION LEGAL FOCUSED READER ── */
.legal-focus { padding:20px; }
.lf-header { margin-bottom:20px; }
.lf-doc { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--primary); margin-bottom:4px; }
.lf-art { font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.lf-title { font-family:var(--serif); font-size:14px; color:var(--ink-2); font-style:italic; line-height:1.4; }
.lf-official-label, .lf-simple-label, .lf-highlights-label {
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:8px; margin-top:20px;
}
.lf-official {
  font-family:var(--serif); font-size:15px; line-height:1.75; color:var(--ink);
  border-left:3px solid var(--border-strong); padding-left:14px;
}
.lf-simple {
  font-size:14px; line-height:1.7; color:var(--ink-2);
  background:var(--primary-soft); border-radius:var(--r-md);
  padding:14px 16px;
}
.lf-highlights { display:flex; flex-direction:column; gap:6px; }
.lf-hl {
  font-size:13px; padding:8px 12px; background:var(--gold-soft);
  border-radius:var(--r-sm); color:var(--ink);
  border-left:3px solid var(--gold);
}

/* Passos da leitura de lei */
.lf-progress { height:3px; background:var(--surface-2); }
.lf-progress-fill { height:100%; background:var(--primary); transition:width .4s cubic-bezier(.22,1,.36,1); }
.lf-steps { display:flex; align-items:center; gap:8px; margin:0 0 22px; }
.lf-step { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3); font-weight:600; }
.lf-step.on { color:var(--primary); }
.lf-step.done { color:var(--success); }
.lf-step-dot {
  width:20px; height:20px; border-radius:var(--r-full); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
  background:var(--surface-2); color:var(--ink-3);
}
.lf-step.on .lf-step-dot { background:var(--primary); color:#fff; }
.lf-step.done .lf-step-dot { background:var(--success); color:#fff; }
.lf-step-line { flex:1; height:1px; background:var(--border-strong); }

/* Expressões que a banca troca, marcadas na leitura */
.lf-key {
  background:var(--gold-soft); color:var(--ink);
  padding:1px 3px; border-radius:3px;
  box-shadow:inset 0 -2px 0 var(--gold);
}

/* Lacunas tocáveis */
.lf-blank {
  display:inline-block; vertical-align:baseline;
  font-family:inherit; font-size:inherit; line-height:1.2;
  padding:2px 8px; margin:0 1px;
  border:none; border-bottom:2px dashed var(--primary);
  background:var(--primary-soft); color:var(--primary);
  border-radius:4px 4px 0 0; cursor:pointer; font-weight:700;
  transition:background .15s;
}
.lf-blank:active { background:var(--primary-tint); }
.lf-blank.on {
  background:var(--success-soft); color:var(--success);
  border-bottom:2px solid var(--success); cursor:default;
  padding:1px 4px; font-weight:600;
  animation:slideUp .25s ease;
}
.lf-counter {
  margin-top:14px; font-size:12px; font-weight:600; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.lf-hint {
  margin-top:14px; font-size:12px; line-height:1.5; color:var(--ink-3);
  padding:10px 12px; background:var(--gold-soft); border-radius:var(--r-sm);
}
.lf-official.lf-muted { font-size:14px; color:var(--ink-3); border-left-color:var(--border); }

/* Guia de instalação (PWA) */
.sheet-backdrop {
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80;
  animation:fadeIn .2s ease;
}
.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:81;
  background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:12px 20px calc(24px + var(--safe-b));
  box-shadow:var(--shadow-lg); max-height:86vh; overflow-y:auto;
  animation:sheetUp .28s cubic-bezier(.22,1,.36,1);
}
.sheet-handle {
  width:38px; height:4px; border-radius:2px; background:var(--border-strong);
  margin:0 auto 18px;
}
.sheet-title { font-family:var(--serif); font-size:22px; font-weight:600; }
.sheet-sub { font-size:14px; color:var(--ink-2); line-height:1.55; margin-top:8px; }
.inst-steps { display:flex; flex-direction:column; gap:14px; margin-top:20px; }
.inst-step { display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.5; color:var(--ink); }
.inst-num {
  width:24px; height:24px; flex-shrink:0; border-radius:var(--r-full);
  background:var(--primary); color:#fff; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.inst-icon { display:inline-block; vertical-align:-3px; color:var(--primary); }
.inst-icon svg { width:15px; height:15px; }
.inst-note {
  margin-top:18px; font-size:12px; line-height:1.5; color:var(--ink-3);
  padding:10px 12px; background:var(--surface-2); border-radius:var(--r-sm);
}
.install-banner {
  display:flex; align-items:center; gap:12px; margin:0 20px 4px;
  padding:12px 14px; background:var(--primary-soft);
  border:1px solid var(--primary-tint); border-radius:var(--r-md); cursor:pointer;
}
.ib-icon { color:var(--primary); flex-shrink:0; display:flex; }
.ib-icon svg { width:20px; height:20px; }
.ib-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.ib-text strong { font-size:13px; color:var(--ink); }
.ib-text span { font-size:11px; color:var(--ink-3); }
.ib-close { background:none; border:none; color:var(--ink-3); padding:4px; cursor:pointer; display:flex; }
.ib-close svg { width:14px; height:14px; }

/* Tela do episódio */
.pn-wrap { padding:28px 20px 32px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.pn-art {
  width:96px; height:96px; border-radius:var(--r-xl); margin-bottom:22px;
  background:var(--primary-soft); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
}
.pn-art svg { width:40px; height:40px; }
.pn-title { font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.3; }
.pn-desc { font-size:13px; color:var(--ink-3); line-height:1.55; margin-top:10px; max-width:34ch; }
.pn-chips { display:flex; gap:8px; margin-top:14px; }
.pn-loading { margin-top:38px; display:flex; flex-direction:column; align-items:center; gap:10px; font-size:14px; color:var(--ink-2); }
.pn-loading-sub { font-size:12px; color:var(--ink-3); max-width:30ch; line-height:1.5; }
.pn-spin {
  width:30px; height:30px; border-radius:var(--r-full);
  border:3px solid var(--surface-2); border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.pn-controls { display:flex; align-items:center; gap:22px; margin-top:34px; }
.pn-play {
  width:68px; height:68px; border-radius:var(--r-full); border:none;
  background:var(--primary); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.pn-play svg { width:26px; height:26px; }
.pn-btn {
  width:44px; height:44px; border-radius:var(--r-full);
  border:1px solid var(--border-strong); background:var(--surface);
  color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.pn-btn svg { width:17px; height:17px; }
.pn-btn.ghost { opacity:.3; }
.pn-track-row { display:flex; align-items:center; gap:10px; width:100%; margin-top:26px; }
.pn-time { font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:38px; }
.pn-track { flex:1; height:5px; background:var(--surface-2); border-radius:var(--r-full); cursor:pointer; }
.pn-fill { height:100%; background:var(--primary); border-radius:var(--r-full); }
.pn-parts { display:flex; gap:5px; margin-top:20px; }
.pn-part { width:26px; height:5px; border-radius:3px; background:var(--surface-2); cursor:pointer; }
.pn-part.done { background:var(--success); }
.pn-part.on { background:var(--primary); }

/* Flashcards */
.fc-wrap { padding:0 0 24px; }
.fc-progress { height:3px; background:var(--surface-2); margin-bottom:24px; }
.fc-progress-fill { height:100%; background:var(--primary); transition:width .4s cubic-bezier(.22,1,.36,1); }
.fc-card {
  margin:0 20px; min-height:280px; display:flex;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow-md);
  cursor:pointer; transition:border-color .2s;
}
.fc-card.flipped { border-color:var(--primary); cursor:default; box-shadow:var(--shadow-lg); }
.fc-face { padding:26px 22px; display:flex; flex-direction:column; gap:14px; width:100%; }
.fc-label {
  font-size:10px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
}
.fc-card.flipped .fc-label { color:var(--primary); }
.fc-content {
  font-family:var(--serif); font-size:17px; line-height:1.6;
  white-space:pre-wrap; flex:1; color:var(--ink);
}
.fc-card.flipped .fc-content { font-size:16px; }
.fc-tap { font-size:12px; color:var(--ink-3); text-align:center; padding-top:8px; }

/* ── MISSION REVIEW QUALITY ── */
.quality-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:0 20px 24px; }
.quality-btn-3 {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px 8px; border-radius:var(--r-md); border:1.5px solid var(--border-strong);
  background:var(--surface); cursor:pointer; gap:4px; transition:background .15s;
}
.quality-btn-3:active { background:var(--surface-2); }
.quality-btn-3.q-wrong { border-color:var(--error); background:var(--error-soft); }
.quality-btn-3.q-hard  { border-color:var(--gold);  background:var(--gold-soft); }
.quality-btn-3.q-easy  { border-color:var(--success); background:var(--success-soft); }
.qb3-label { font-size:14px; font-weight:600; color:var(--ink); }
.qb3-hint  { font-size:11px; color:var(--ink-3); }

/* ── TRILHA ── */
.trilha-subject { border-bottom:1px solid var(--border); }
.trilha-subject-header {
  display:flex; align-items:center; gap:12px; padding:16px 20px; cursor:pointer;
  transition:background .15s;
}
.trilha-subject-header:active { background:var(--surface-2); }
.trilha-subject-header .subj-color {
  width:6px; height:36px; border-radius:3px; flex-shrink:0;
}
.trilha-subject-header .subj-info { flex:1; min-width:0; }
.trilha-subject-header .subj-info h3 { font-size:15px; font-weight:600; margin-bottom:2px; }
.trilha-subject-header .subj-info .subj-meta { font-size:12px; color:var(--ink-3); }
.trilha-subject-header .subj-pct {
  font-family:var(--mono); font-size:14px; font-weight:700; flex-shrink:0;
}
.trilha-topics { padding:0 20px 12px 38px; display:none; }
.trilha-subject.open .trilha-topics { display:block; }
.trilha-topic {
  display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--border-soft, rgba(128,128,128,.12));
  font-size:13.5px;
}
.trilha-topic:last-child { border-bottom:none; }
.trilha-topic .t-dot {
  width:10px; height:10px; border-radius:50%; flex-shrink:0;
}
.trilha-topic .t-dot.dominado { background:var(--success); }
.trilha-topic .t-dot.em-andamento { background:var(--warning); }
.trilha-topic .t-dot.nao-iniciado { background:var(--ink-3); opacity:.4; }
.trilha-topic .t-name { flex:1; min-width:0; }
.trilha-topic .t-pct { font-family:var(--mono); font-size:12px; color:var(--ink-3); min-width:40px; text-align:right; }
.trilha-overall {
  display:flex; align-items:center; gap:16px; padding:20px;
  background:var(--surface); border-radius:var(--r-md); margin:16px 20px;
}
.trilha-overall .big-pct {
  font-family:var(--mono); font-size:32px; font-weight:800; color:var(--primary);
}
.trilha-overall .big-label { font-size:13px; color:var(--ink-3); }

/* ── SETTINGS ── */
.settings-section { padding:20px; }
.exam-toggle {
  display:flex; gap:0; border:2px solid var(--primary); border-radius:var(--r-md);
  overflow:hidden; margin:12px 0 20px;
}
.exam-toggle button {
  flex:1; padding:14px 8px; font-size:15px; font-weight:700;
  background:transparent; color:var(--primary); border:none; cursor:pointer;
  transition:all .2s;
}
.exam-toggle button.active {
  background:var(--primary); color:#fff;
}
.settings-field { margin-bottom:18px; }
.settings-field label { display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:8px; }
.settings-field select, .settings-field input[type=date] {
  width:100%; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); color:var(--ink); font-size:14px; font-family:inherit; -webkit-appearance:none;
}
.settings-field select:focus, .settings-field input:focus { outline:none; border-color:var(--primary); }
.settings-hint { font-size:12px; color:var(--ink-3); margin-top:6px; line-height:1.4; }
.settings-save-status { font-size:13px; color:var(--success); margin-top:10px; text-align:center; }

/* ── ESSAYS ── */
.essay-hero { padding:24px 20px 20px; }
.theme-card { padding:18px 20px; cursor:pointer; border-bottom:1px solid var(--border); transition:background .15s; }
.theme-card:hover { background:var(--surface-2); }
.theme-card h3 { font-family:var(--serif); font-size:17px; font-weight:500; margin-bottom:4px; line-height:1.3; }
.theme-card p { font-size:13px; color:var(--ink-2); line-height:1.5; }
.theme-card .tag {
  display:inline-block; margin-top:10px; padding:4px 10px;
  border-radius:var(--r-full); background:var(--surface-2);
  color:var(--ink-2); font-size:11px; font-weight:600;
}
.essay-write { padding:16px 20px; }
.essay-theme-card { padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:16px; }
.essay-theme-card h3 { font-family:var(--serif); font-size:16px; font-weight:500; margin-bottom:6px; }
.essay-theme-card p { font-family:var(--serif); font-size:13.5px; color:var(--ink-2); line-height:1.6; font-style:italic; }
.essay-editor { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:16px; transition:border-color .2s; }
.essay-editor:focus-within { border-color:var(--primary); }
.essay-editor textarea {
  width:100%; min-height:320px; background:none; border:none; outline:none;
  color:var(--ink); font-family:var(--serif); font-size:15px; line-height:1.8; resize:vertical;
}
.essay-editor textarea::placeholder { color:var(--ink-3); font-style:italic; }
.essay-editor .counter {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
  font-size:12px; color:var(--ink-3); font-family:var(--mono);
}
.essay-editor .counter .lines-num { color:var(--ink); font-weight:600; }
.essay-editor .counter .over { color:var(--error); }
.essay-result { padding:24px 20px; }
.essay-score-hero { text-align:center; padding:32px 20px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); margin-bottom:20px; }
.essay-score-hero .score-lbl { font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.14em; font-weight:700; margin-bottom:10px; }
.essay-score-hero .score-num { font-family:var(--serif); font-size:84px; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
.essay-score-hero .score-max { font-size:24px; color:var(--ink-3); }
.essay-breakdown { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:20px; overflow:hidden; }
.essay-breakdown .row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px; }
.essay-breakdown .row:last-child { border-bottom:none; background:var(--surface-2); }
.essay-breakdown .row .lbl { color:var(--ink-2); }
.essay-breakdown .row .val { font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; }
.essay-breakdown .row .val.neg { color:var(--error); }
.essay-diagnosis {
  padding:18px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); font-family:var(--serif); font-size:14px;
  line-height:1.75; color:var(--ink-2); white-space:pre-wrap;
}

/* ── MORE MENU ── */
.more-list { padding:8px 20px 20px; display:flex; flex-direction:column; gap:10px; }

.toast-wrap {
  position:fixed; top:calc(var(--safe-t) + 16px); left:20px; right:20px;
  z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
.toast {
  padding:12px 16px; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-md); color:var(--ink); font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-lg); animation:toastIn .3s cubic-bezier(.22,1,.36,1);
  display:flex; align-items:center; gap:8px; pointer-events:auto;
}
.toast.xp { border-color:var(--gold); } .toast.xp .toast-icon { color:var(--gold); }
.toast.success { border-color:var(--success); } .toast.success .toast-icon { color:var(--success); }
.toast.error { border-color:var(--error); } .toast.error .toast-icon { color:var(--error); }
.toast .toast-icon { display:flex; }
.toast .toast-icon svg { width:18px; height:18px; }

.skeleton {
  background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);
  background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite;
  border-radius:var(--r-md);
}
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
.splash {
  position:fixed; inset:0; background:var(--bg); display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  z-index:999; transition:opacity .4s ease;
}
.splash.hide { opacity:0; pointer-events:none; }
.splash-brand { font-family:var(--serif); font-size:34px; letter-spacing:-.02em; margin-bottom:6px; }
.splash-brand em { font-style:italic; color:var(--accent); }
.splash-sub { font-size:13px; color:var(--ink-3); margin-bottom:32px; }
.spinner { width:24px; height:24px; border:2px solid var(--surface-2); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.empty { text-align:center; padding:60px 32px; }
.empty svg { width:48px; height:48px; color:var(--ink-3); margin-bottom:16px; }
.empty h3 { font-family:var(--serif); font-size:20px; font-weight:500; margin-bottom:8px; }
.empty p { font-size:14px; color:var(--ink-3); line-height:1.5; max-width:280px; margin:0 auto; }

.fade-in { animation:fadeIn .35s cubic-bezier(.22,1,.36,1); }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes toastIn { from { opacity:0; transform:translateY(-10px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

.mt-8 { margin-top:8px; } .mt-12 { margin-top:12px; }
.mt-16 { margin-top:16px; } .mt-24 { margin-top:24px; }
.streak-inline {
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px;
  background:var(--accent-soft); color:var(--accent); border-radius:var(--r-full);
  font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
}
.streak-inline svg { width:12px; height:12px; }
.level-chip {
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px;
  border-radius:var(--r-full); border:1px solid var(--border);
  color:var(--ink-2); font-size:11.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
}

.mission-block {
  margin:0 20px 4px; padding:20px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow-sm);
}
.mission-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
}
.mission-ring { position:relative; width:48px; height:48px; flex-shrink:0; }
.mission-svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--surface-2); stroke-width:3; }
.ring-fill {
  fill:none; stroke:var(--primary); stroke-width:3;
  stroke-linecap:round; transition:stroke-dasharray .6s cubic-bezier(.22,1,.36,1);
}
.ring-fill.done { stroke:var(--success); }
.ring-text {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.mission-regen-btn {
  display:block; width:100%; text-align:center; margin-bottom:14px;
  padding:8px; font-size:12px; font-weight:600; color:var(--primary);
  background:var(--primary-soft); border:none; border-radius:var(--r-sm); cursor:pointer;
}
.mission-cta {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  margin:0 20px 8px; padding:16px 20px;
  background:var(--primary); color:#fff; border:none; border-radius:var(--r-lg);
  cursor:pointer; width:calc(100% - 40px); box-shadow:var(--shadow-md);
  transition:transform .15s, box-shadow .15s;
}
.mission-cta:active { transform:scale(.98); box-shadow:var(--shadow-sm); }
.cta-label { font-size:16px; font-weight:700; letter-spacing:0.01em; }
.cta-detail { font-size:12px; opacity:.85; font-weight:500; }
.rest-day-block { border-left:3px solid var(--gold); }
.carry-warn {
  display:flex; align-items:flex-start; gap:8px; margin-bottom:12px;
  padding:10px 12px; border-radius:10px;
  background:var(--gold-soft); color:var(--gold);
  font-size:12.5px; line-height:1.45; font-weight:600;
}
.carry-warn svg { width:16px; height:16px; flex-shrink:0; margin-top:1px; }

/* Videoaula toca dentro da própria etapa da missão. */
.task-embed { padding:0 0 14px 34px; display:flex; flex-direction:column; gap:10px; }
.task-embed .vid-card { margin:0; }
.task-embed-link {
  font-size:12.5px; color:var(--primary); text-decoration:none; font-weight:600;
}
.task-embed-link:hover { text-decoration:underline; }

/* ── Trajetória ── */
/* Menu "Mais" agrupado por finalidade. */
.more-group { margin-bottom: 22px; }
.more-group-title {
  font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); padding:0 4px 8px;
}

/* Histórico de redação — nota em destaque, porque é ela que mostra evolução. */
.essay-hist { padding:0 20px; display:flex; flex-direction:column; }
.essay-hist-row {
  display:flex; align-items:center; gap:14px; padding:12px 0;
  border-top:1px solid var(--border); cursor:pointer;
}
.essay-hist-row:first-child { border-top:none; }
.essay-hist-row:active { opacity:.7; }
.eh-score {
  font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--primary); flex-shrink:0; min-width:58px;
}
.eh-max { font-size:12px; font-weight:600; color:var(--ink-3); }
.eh-info { flex:1; min-width:0; }
.eh-title { font-size:14.5px; font-weight:600; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.eh-meta { font-size:12px; color:var(--ink-3); margin-top:1px; }

.plano-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
.pl-stat {
  display:flex; flex-direction:column; gap:2px; padding:10px 12px;
  border:1px solid var(--border); border-radius:10px;
}
.pl-num { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.pl-lbl { font-size:11.5px; color:var(--ink-3); line-height:1.3; }
.plano-list { display:flex; flex-direction:column; }
.plano-day {
  display:flex; align-items:center; gap:12px; padding:11px 0;
  border-top:1px solid var(--border);
}
.plano-day:first-child { border-top:none; }
.plano-day.pl-future { opacity:.82; }
.plano-day.pl-missed .pl-title { color:var(--ink-3); }
.plano-day.is-today {
  border-left:3px solid var(--primary); padding-left:10px;
  background:var(--primary-soft, transparent); border-radius:8px;
}
.pl-date {
  width:34px; flex-shrink:0; display:flex; flex-direction:column;
  align-items:center; line-height:1.05;
}
.pl-dnum { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
.pl-dweek { font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
.pl-kind { flex-shrink:0; color:var(--ink-3); }
.pl-kind svg { width:17px; height:17px; }
.pl-info { flex:1; min-width:0; }
.pl-title { font-size:13.5px; font-weight:600; line-height:1.3; }
.pl-sub {
  font-size:12px; color:var(--ink-3); line-height:1.35; margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pl-check { color:var(--success); flex-shrink:0; }
.pl-check svg { width:20px; height:20px; }
.pl-frac {
  font-size:11.5px; font-weight:700; color:var(--gold);
  font-variant-numeric:tabular-nums; flex-shrink:0;
}
.pl-miss { color:var(--ink-3); font-size:16px; flex-shrink:0; }

.mission-tasks { display:flex; flex-direction:column; gap:2px; }
.mission-task {
  display:flex; align-items:center; gap:12px; padding:12px 0;
  border-top:1px solid var(--border); cursor:pointer; transition:opacity .2s;
}
.mission-task:first-child { border-top:none; }
.mission-task:active:not(.done) { opacity:.7; }
.mission-task.done { opacity:.55; }
.mission-task.done .task-title { text-decoration:line-through; }
.task-check { width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.task-check svg { width:22px; height:22px; }
.task-circle {
  width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong);
  transition:border-color .2s;
}
.mission-task:hover:not(.done) .task-circle { border-color:var(--primary); }
.task-icon { flex-shrink:0; color:var(--ink-3); }

<body>

<div id="splash" class="splash">
  <div class="splash-brand">Estudo <em>PMGO</em></div>
  <div class="splash-sub">Plataforma adaptativa</div>
  <div class="spinner"></div>
</div>

<div id="toast-wrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>
<div id="app"></div>
<audio id="audio-el" preload="none"></audio>

<script>
const API = '';

const S = {
  theme: localStorage.getItem('prf_theme') || 'auto',
  tab: 'dashboard', subView: null,
  token: localStorage.getItem('prf_token'),
  loading: {},
  dashboard: null, subjects: null,
  selSubject: null, selSubjectName: '', resources: null,
  questions: [], qIndex: 0, answerResult: null, answered: {},
  sim: null, simQuestions: {}, simBlock: 1, simIndex: {}, simAnswers: {},
  simResult: null, simSeconds: 0,
  legalDocs: null, selDoc: null, selDocName: '', articles: [],
  searchQ: '', searchResults: null,
  themes: null, selTheme: null, essayText: '', essayResult: null,
  lessons: null, playingId: null, audioPos: 0, audioDur: 0, audioPlaying: false,
  podcasts: null, pod: null, podId: null, podSeq: 0,
  podBoundaries: null, podLoading: false,
  reviews: null, reviewIdx: 0, reviewSummary: null, reviewRevealed: false,
  reviewQuestion: null, reviewAnswered: null,
  missionLegalArticles: null, missionLegalIdx: 0,
  lfStep: 'ler', lfRevealed: [],
  fcCards: null, fcIdx: 0, fcFlipped: false,
  podKind: 'aula',
  tutorConv: null, tutorMsgs: [], tutorTyping: false,
  pushOn: false, showInstall: false,
  targetExam: localStorage.getItem('prf_target_exam') || 'PMGO',
  trilha: null,
  mission: null,
  activeMissionIdx: null,
  coverage: null,
  studyProfile: null, savingProfile: false,
  history: null, consistency: null,
  plano: null, planoHistorico: false, pendingSimBlockId: null,
  essayHistory: null,
};

let timerInterval = null;
const audioEl = document.getElementById('audio-el');

// ===== THEME =====
function applyExamTheme(exam) {
  const root = document.documentElement;
  if (exam && exam.startsWith('PM')) {
    root.setAttribute('data-exam', 'PMGO');
  } else {
    root.removeAttribute('data-exam');
  }
}
function applyTheme() {
  const root = document.documentElement;
  if (S.theme === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', S.theme);
  localStorage.setItem('prf_theme', S.theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const isDark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    meta.setAttribute('content', isDark ? '#0F0E0C' : '#FBFAF7');
  }
}
function toggleTheme() {
  const modes = ['auto', 'light', 'dark'];
  S.theme = modes[(modes.indexOf(S.theme) + 1) % 3];
  applyTheme(); render();
  toast(S.theme === 'auto' ? 'Tema automático' : S.theme === 'light' ? 'Modo claro' : 'Modo escuro', 'success');
}

// ===== AUTH =====
function uid() {
  return 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
async function ensureAuth() {
  if (S.token) {
    try {
      const r = await fetch(`${API}/api/prf/auth/me`, { headers: { 'Authorization': `Bearer ${S.token}` } });
      if (r.ok) return;
    } catch (e) {}
    S.token = null; localStorage.removeItem('prf_token');
  }
  let deviceId = localStorage.getItem('prf_device_id');
  if (!deviceId) { deviceId = uid(); localStorage.setItem('prf_device_id', deviceId); }
  const creds = {
    email: `estudante-${deviceId}@prfestudo.app`,
    password: `PRF#${deviceId.slice(0, 16)}`,
    name: 'Estudante PMGO',
  };
  let r = await fetch(`${API}/api/prf/auth/register`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(creds),
  });
  if (r.status === 409 || r.status === 400) {
    r = await fetch(`${API}/api/prf/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: creds.email, password: creds.password }),
    });
  }
  if (!r.ok) throw new Error('Auth failed');
  const data = await r.json();
  S.token = data.access_token;
  localStorage.setItem('prf_token', S.token);
}

// ===== API =====
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
  if (opts.json) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.json);
    delete opts.json;
  }
  let r;
  try {
    r = await fetch(`${API}${path}`, { ...opts, headers });
  } catch (networkErr) {
    // Falha de rede de verdade (sem sinal), não erro HTTP — enfileira POSTs
    // pra reenviar quando a conexão voltar, em vez de perder o registro.
    if ((opts.method || 'GET').toUpperCase() === 'POST') _queueOfflineRequest(path, opts);
    throw networkErr;
  }
  if (r.status === 401) {
    S.token = null; localStorage.removeItem('prf_token');
    await ensureAuth();
    headers['Authorization'] = `Bearer ${S.token}`;
    const r2 = await fetch(`${API}${path}`, { ...opts, headers });
    if (!r2.ok) throw new Error(await r2.text());
    return r2.json();
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ===== FILA OFFLINE =====
// Resposta de questão/simulado dada sem sinal (comute, elevador, túnel) não
// pode simplesmente sumir — guarda no localStorage e reenvia sozinho quando
// a conexão volta, sem exigir que o usuário perceba e refaça manualmente.
const OFFLINE_QUEUE_KEY = 'prf_offline_queue';
function _queueOfflineRequest(path, opts) {
  try {
    const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
    q.push({ path, method: (opts.method || 'POST').toUpperCase(), body: opts.body || null });
    localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q.slice(-50)));
  } catch (e) {}
}
async function flushOfflineQueue() {
  let q;
  try { q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); } catch (e) { return; }
  if (!q.length) return;
  const remaining = [];
  for (const item of q) {
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
      const r = await fetch(`${API}${item.path}`, { method: item.method, headers, body: item.body });
      if (!r.ok && r.status !== 400 && r.status !== 404) remaining.push(item);
    } catch (e) { remaining.push(item); }
  }
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(remaining));
  if (remaining.length < q.length) toast('Respostas offline sincronizadas', 'success');
}
window.addEventListener('online', flushOfflineQueue);
// ===== LEMBRETES (WEB PUSH) =====
// O agendador no servidor decide quando cobrar; sem o service worker inscrito
// essa cobrança não sai do banco. É este trecho que fecha o caminho até a tela.

async function registrarSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
    reg.update();
    return reg;
  } catch (e) {
    console.warn('[PRF] service worker não registrou:', e);
    return null;
  }
}

function b64ToUint8(base64) {
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function sincronizarPush() {
  // Só reflete o estado atual; nunca pede permissão sozinho.
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    S.pushOn = !!sub && Notification.permission === 'granted';
  } catch (e) { S.pushOn = false; }
}

// No iOS o Web Push só existe depois que o app foi adicionado à tela de
// início: em aba do Safari, window.PushManager sequer é definido. Sem essa
// distinção o app dizia "seu navegador não suporta", que é falso e deixa o
// usuário sem saber que basta instalar.
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone() {
  return window.navigator.standalone === true
      || window.matchMedia('(display-mode: standalone)').matches;
}
function abrirGuiaInstalacao() { S.showInstall = true; render(); }
function dispensarInstalacao() {
  try { localStorage.setItem('install_dismissed', '1'); } catch (e) {}
  render();
}
function fecharGuiaInstalacao() { S.showInstall = false; render(); }

function viewInstallGuide() {
  if (!S.showInstall) return '';
  const ios = isIOS();
  return `<div class="sheet-backdrop" onclick="fecharGuiaInstalacao()"></div>
    <div class="sheet fade-in">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Instalar o app</div>
      <div class="sheet-sub">${ios
        ? 'No iPhone, os alertas só funcionam com o app instalado na tela de início. São três toques:'
        : 'Instale para abrir direto da tela de início e receber os alertas.'}</div>
      ${ios ? `
        <div class="inst-steps">
          <div class="inst-step"><span class="inst-num">1</span>
            <div>Toque em <strong>Compartilhar</strong> na barra do Safari
              <span class="inst-icon">${I.share || '&#8593;'}</span></div></div>
          <div class="inst-step"><span class="inst-num">2</span>
            <div>Role e toque em <strong>Adicionar à Tela de Início</strong></div></div>
          <div class="inst-step"><span class="inst-num">3</span>
            <div>Abra o app pelo ícone e volte aqui para ativar os alertas</div></div>
        </div>
        <div class="inst-note">Precisa ser pelo <strong>Safari</strong>. Chrome e Firefox no iPhone não conseguem instalar.</div>
      ` : `
        <div class="inst-steps">
          <div class="inst-step"><span class="inst-num">1</span>
            <div>Abra o menu do navegador</div></div>
          <div class="inst-step"><span class="inst-num">2</span>
            <div>Toque em <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong></div></div>
        </div>
      `}
      <button class="btn btn-primary btn-full btn-lg mt-16" onclick="fecharGuiaInstalacao()">Entendi</button>
    </div>`;
}

async function toggleLembretes() {
  if (!('serviceWorker' in navigator)) {
    return toast('Este navegador não suporta lembretes', 'error');
  }
  // iOS fora da tela de início: não é falta de suporte, é falta de instalação.
  if (!('PushManager' in window)) {
    if (isIOS() && !isStandalone()) return abrirGuiaInstalacao();
    return toast('Este navegador não suporta lembretes', 'error');
  }

  const reg = await navigator.serviceWorker.ready;
  const atual = await reg.pushManager.getSubscription();

  if (atual && S.pushOn) {
    await api('/api/prf/notifications/push/cancelar', { method:'POST', json:{ endpoint: atual.endpoint } });
    await atual.unsubscribe();
    S.pushOn = false;
    toast('Lembretes desativados');
    return render();
  }

  if (Notification.permission === 'denied') {
    return toast('Você bloqueou notificações para este site. Libere nas configurações do navegador.', 'error');
  }
  if (Notification.permission !== 'granted') {
    const p = await Notification.requestPermission();
    if (p !== 'granted') return toast('Permissão negada', 'error');
  }

  let chave;
  try {
    chave = await api('/api/prf/notifications/push/chave-publica');
  } catch (e) { return toast('Não consegui falar com o servidor', 'error'); }
  if (!chave.configured) {
    return toast('Lembretes ainda não configurados no servidor', 'error');
  }

  try {
    const sub = atual || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(chave.public_key)
    });
    const j = sub.toJSON();
    await api('/api/prf/notifications/push/inscrever', {
      method:'POST',
      json:{ endpoint: j.endpoint, keys: j.keys }
    });
    S.pushOn = true;
    toast('Pronto. Vou te cobrar por aqui.');
    render();
  } catch (e) {
    console.warn(e);
    toast('Não consegui ativar os lembretes', 'error');
  }
}

async function apiForm(path, formData) {
  const headers = {};
  if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
  const r = await fetch(`${API}${path}`, { method: 'POST', headers, body: formData });

  return r.json();
}

// ===== UTILS =====
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function attr(v) { return esc(JSON.stringify(String(v))).replace(/&quot;/g, '&quot;'); }
function _ytId(url) {
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/youtube\.com\/playlist\?list=([a-zA-Z0-9_-]+)/);
  if (m) return 'playlist:' + m[1];
  return null;
}
function _ytEmbedUrl(ytId) {
  if (ytId.startsWith('playlist:')) return `https://www.youtube.com/embed/videoseries?list=${ytId.slice(9)}`;
  return `https://www.youtube.com/embed/${ytId}`;
}

function renderCoverageHeatmap() {
  const cov = S.coverage;
  if (!cov || !cov.subjects || !cov.subjects.length) return '';
  const flagOrder = { empty: 0, critical: 1, low: 2, good: 3 };
  const subjects = [...cov.subjects].sort((a,b) => flagOrder[a.flag] - flagOrder[b.flag]);
  const readiness = Math.round((cov.exam_readiness_score || 0) * 100);
  const readColor = readiness >= 80 ? 'var(--success)' : readiness >= 50 ? '#F59E0B' : 'var(--error)';
  return `<div class="coverage-block">

// uma etapa dessa unidade — o vídeo é a única que renderiza o conteúdo dentro

const BLOCK_ICON = {
  questions: 'book', review: 'refresh', legal_reading: 'scale',
  flashcards: 'brain', podcast: 'headphones', podcast_drill: 'headphones',

function missionTaskRow(b, i) {
  if (b.block_type === 'audio' || b.block_type === 'audio_lesson') return '';
  const done = b.is_completed;
  const icon = I[BLOCK_ICON[b.block_type] || 'target'];
  const action = `startMissionBlock(${i},'${blockActionType(b)}')`;
  const check = done
    ? '<svg viewBox="0 0 24 24" fill="var(--success)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'

    </div>
    ${done ? '' : `<div class="chev">${I.chev}</div>`}

  // Videoaula toca dentro da missão. Quando não há vídeo curado para a
  // matéria, o payload traz uma busca pronta no YouTube — que não pode ser

  if (b.block_type === 'video_lesson' && !done) {
    const p = b.payload || {};
    const inner = p.video_id

      : '';
    return row + `<div class="task-embed">

}
