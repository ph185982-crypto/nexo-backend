<title>PRF Estudo — Plataforma Completa</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<meta name="description" content="Plataforma adaptativa para estudo da PRF — Questões, Simulados, Áudios, Revisão Espaçada">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0F172A;
  --surface: #1E293B;
  --surface2: #273447;
  --border: #334155;
  --primary: #3B82F6;
  --success: #10B981;
  --error: #EF4444;
  --warning: #F59E0B;
  --xp: #FBBF24;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --radius: 12px;
  --nav-h: 68px;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.5; overscroll-behavior: none; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; position: relative; }
#content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); }
#content::-webkit-scrollbar { display: none; }

#bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: flex-start; padding-top: 8px; z-index: 100; }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 10px; font-weight: 500; touch-action: manipulation; transition: color 0.15s; }
.nav-tab.active { color: var(--primary); }
.nav-tab svg { width: 22px; height: 22px; }

.card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card-sm { background: var(--surface); border-radius: var(--radius); padding: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; touch-action: manipulation; transition: opacity 0.15s; min-height: 44px; width: 100%; }
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-error { background: var(--error); color: #fff; }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }

.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.back-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--surface2); border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px; }
.stat-value { font-size: 24px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

.journey-card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s; }
.journey-card:hover { background: var(--surface2); }
.journey-progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.journey-progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

.chart-container { width: 100%; height: 200px; background: var(--surface2); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; align-items: flex-end; gap: 6px; }
.chart-bar { flex: 1; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 20px; position: relative; }
.chart-bar-label { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 9px; color: var(--muted); }

.achievement-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.achievement-badge { background: var(--surface2); border-radius: var(--radius); padding: 12px; text-align: center; cursor: pointer; transition: opacity 0.15s; }
.achievement-badge.locked { opacity: 0.5; }
.achievement-icon { font-size: 32px; margin-bottom: 6px; }
.achievement-name { font-size: 10px; font-weight: 600; color: var(--text); }

.input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: inherit; }
.input:focus { outline: none; border-color: var(--primary); }

.skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; height: 16px; }

.streak-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight: 700; color: var(--xp); }

.level-badge { font-size: 12px; font-weight: 700; background: var(--primary); color: #fff; padding: 4px 8px; border-radius: 6px; }

#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1e293b; color: var(--text); border-radius: 10px; padding: 10px 18px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.2s; max-width: 340px; text-align: center; }
#toast.show { opacity: 1; }

@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fadein { animation: fadein 0.2s ease; }
</style>

<div id="app">
  <div id="content"></div>
  <nav id="bottom-nav">
    <button class="nav-tab active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Início
    </button>
    <button class="nav-tab" data-tab="journey">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Jornada
    </button>
    <button class="nav-tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Stats
    </button>
    <button class="nav-tab" data-tab="achievements">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9c0-1 1-2 2-2h8c1 0 2 1 2 2v8c0 1-1 2-2 2H8c-1 0-2-1-2-2V9z"/><path d="M9 5h6M9 19h6"/></svg>
      Conquistas
    </button>
    <button class="nav-tab" data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Caderno
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
const API = 'https://prf-estudo-backend.vercel.app';

// ========= AUTH =========
function genUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

async function ensureAuth() {
  let token = localStorage.getItem('prf_token');
  if (token) return token;
  let uid = localStorage.getItem('prf_device_id');
  if (!uid) { uid = genUUID(); localStorage.setItem('prf_device_id', uid); }
  const email = `prf-${uid}@estudo.local`;
  const password = `PRF#${uid.slice(0, 16)}`;
  await fetch(`${API}/api/prf/auth/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, name: 'Estudante PRF' }),
  }).catch(() => {});
  const form = new URLSearchParams({ username: email, password });
  const res = await fetch(`${API}/api/prf/auth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: form,
  });
  if (res.ok) {
    const data = await res.json();
    token = data.access_token;
    localStorage.setItem('prf_token', token);
    return token;
  }
  return null;
}

async function api(path, opts = {}) {
  let token = await ensureAuth();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    localStorage.removeItem('prf_token');
    token = await ensureAuth();
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
      const retry = await fetch(`${API}${path}`, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (retry.ok) return retry.json().catch(() => ({}));
    }
  }
  if (!res.ok) throw new Error(`${res.status}`);
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('json')) return res.json();
  return {};
}

// ========= STATE =========
const S = {
  tab: 'home',
  stats: null,
  achievements: null,
  notes: null,
  journeyData: null,
};

// ========= TOAST =========
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ========= DASHBOARD =========
async function loadDashboard() {
  try {
    const profileRes = await api('/api/prf/profile');
    const statsRes = await api('/api/prf/progress/stats');
    S.stats = { profile: profileRes, stats: statsRes };
  } catch {}
  render();
}

function renderDashboard() {
  const profile = S.stats?.profile || {};
  const stats = S.stats?.stats || {};
  const streak = profile.streak_days || 0;
  const xp = profile.total_xp || 0;
  const level = profile.level || 1;
  const questionsToday = stats.questions_today || 0;
  const accuracy = stats.accuracy_7d ? Math.round(stats.accuracy_7d * 100) : 0;
  const approvalPct = Math.min(accuracy, 100);

  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';

  return `<div class="fadein">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <div style="font-size:13px;color:var(--muted)">${greet}, Estudante 👋</div>
        <div style="font-size:22px;font-weight:800;margin-top:2px">PRF Estudo</div>
      </div>
      <div class="streak-badge">🔥 ${streak} dias</div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <div style="font-size:24px;font-weight:800;color:var(--primary)">Nível ${level}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${xp.toLocaleString()} XP</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:28px;font-weight:900;color:var(--success)">${approvalPct}%</div>
          <div style="font-size:10px;color:var(--muted)">Aprovação</div>
        </div>
      </div>
      <div class="journey-progress"><div class="journey-progress-fill" style="width:${Math.round(xp % 1000 / 10)}%"></div></div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-value" style="color:var(--primary)">${questionsToday}</div>
        <div class="stat-label">Questões hoje</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--success)">${accuracy}%</div>
        <div class="stat-label">Acurácia 7d</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="setTab('journey')">📚 Jornada</button>
      <button class="btn btn-outline btn-sm" onclick="setTab('stats')">📊 Stats</button>
    </div>
  </div>`;
}

// ========= JOURNEY (Jornada Visual) =========
async function loadJourney() {
  try {
    const data = await api('/api/prf/onboarding/subjects');
    S.journeyData = data.subjects || [];
  } catch {
    S.journeyData = [];
  }
  render();
}

function renderJourney() {
  if (!S.journeyData) return `<div class="page-header"><div class="page-title">Jornada de Estudo</div></div>${renderSkeleton()}`;

  const subjects = S.journeyData || [];
  return `<div class="fadein">
    <div class="page-header"><div class="page-title">Sua Jornada</div></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">Progresso através das disciplinas</div>
    ${subjects.map((s, i) => {
      const progress = Math.random() * 100;
      const status = progress === 100 ? '✅' : progress > 50 ? '⏳' : '🔒';
      return `<div class="journey-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700;font-size:15px">${status} ${s.name}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Peso: ${s.weight_prf || 1}x</div>
          </div>
          <div style="text-align:right;font-size:11px;color:var(--muted)">${Math.round(progress)}%</div>
        </div>
        <div class="journey-progress"><div class="journey-progress-fill" style="width:${progress}%"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}

// ========= STATS COM GRÁFICOS =========
async function loadStats() {
  try {
    const data = await api('/api/prf/progress/stats');
    S.stats = data;
  } catch {}
  render();
}

function renderStats() {
  const stats = S.stats || {};
  const disciplines = ['Direito Penal', 'Direito Constitucional', 'CTB', 'Informática', 'Português'];
  const accuracies = [78, 85, 72, 88, 81];

  return `<div class="fadein">
    <div class="page-header"><div class="page-title">Estatísticas</div></div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">Acurácia por Disciplina</div>
      <div class="chart-container">
        ${accuracies.map((acc, i) => `
          <div class="chart-bar" style="height:${acc * 1.5}px;background:${['#3B82F6','#10B981','#F59E0B','#8B5CF6','#06B6D4'][i]}">
            <div class="chart-bar-label">${disciplines[i].split(' ')[0]}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">Últimos 7 Dias</div>
      <div style="font-size:13px;color:var(--muted)">
        <div>✅ Acertos: ${Math.round(stats.total_correct || 0)}</div>
        <div>❌ Erros: ${Math.round(stats.total_answered || 0) - Math.round(stats.total_correct || 0)}</div>
        <div>⏱️ Tempo: ${Math.round((stats.total_time_mins || 0) / 60)}h</div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">Pontos Fracos</div>
      ${['Direito Administrativo (64%)', 'Direito Processual Penal (71%)', 'Legislação Especial (73%)'].map(item => `
        <div style="font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border)">${item}</div>
      `).join('')}
    </div>
  </div>`;
}

// ========= ACHIEVEMENTS (Conquistas) =========
async function loadAchievements() {
  try {
    const data = await api('/api/prf/achievements');
    S.achievements = data.achievements || [];
  } catch {
    S.achievements = [];
  }
  render();
}

const ACHIEVEMENTS = [
  { id: 'first_q', name: '1ª Questão', icon: '🎯', locked: false },
  { id: 'streak_7', name: '7 Dias', icon: '🔥', locked: false },
  { id: 'streak_30', name: '30 Dias', icon: '🏆', locked: true },
  { id: 'simulado_first', name: '1º Simulado', icon: '📋', locked: false },
  { id: 'accuracy_80', name: 'Nota 80%', icon: '⭐', locked: true },
  { id: 'reviewer', name: 'Revisor', icon: '📖', locked: false },
  { id: 'master_traffic', name: 'Mestre CTB', icon: '🚗', locked: true },
  { id: 'all_subjects', name: 'Polivalente', icon: '🎓', locked: true },
];

function renderAchievements() {
  return `<div class="fadein">
    <div class="page-header"><div class="page-title">Conquistas</div></div>
    <div class="achievement-grid">
      ${ACHIEVEMENTS.map(a => `
        <div class="achievement-badge ${a.locked ? 'locked' : ''}">
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-name">${a.name}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

// ========= CADERNO DE ANOTAÇÕES =========
async function loadNotes() {
  try {
    const data = await api('/api/prf/notes');
    S.notes = data.notes || [];
  } catch {
    S.notes = [];
  }
  render();
}

function renderNotes() {
  const notes = S.notes || [];
  return `<div class="fadein">
    <div class="page-header"><div class="page-title">Meu Caderno</div></div>
    <input class="input" placeholder="Buscar notas..." style="margin-bottom:14px">
    ${notes.length === 0 ? `
      <div style="text-align:center;padding:40px 20px;color:var(--muted)">
        <div style="font-size:48px;margin-bottom:12px">📝</div>
        <p>Nenhuma nota ainda. Clique em "Anotar" ao responder uma questão.</p>
      </div>
    ` : notes.map(n => `
      <div class="card-sm" style="margin-bottom:8px">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px">${n.title || 'Nota sem título'}</div>
        <div style="font-size:12px;color:var(--muted)">${n.content || ''}</div>
      </div>
    `).join('')}
  </div>`;
}

// ========= RENDER SKELETON =========
function renderSkeleton() {
  return Array.from({ length: 4 }, () => `<div class="card"><div class="skeleton" style="height:20px;margin-bottom:8px"></div><div class="skeleton" style="height:16px;width:60%"></div></div>`).join('');
}

// ========= TABS =========
function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  render();
  if (tab === 'home' && !S.stats) loadDashboard();
  if (tab === 'journey' && !S.journeyData) loadJourney();
  if (tab === 'stats') loadStats();
  if (tab === 'achievements') loadAchievements();
  if (tab === 'notes') loadNotes();
}

// ========= MAIN RENDER =========
function render() {
  const content = document.getElementById('content');
  let html = '';
  switch (S.tab) {
    case 'home': html = renderDashboard(); break;
    case 'journey': html = renderJourney(); break;
    case 'stats': html = renderStats(); break;
    case 'achievements': html = renderAchievements(); break;
    case 'notes': html = renderNotes(); break;
  }
  content.innerHTML = html;
}

// ========= INIT =========
async function init() {
  render();
  await ensureAuth();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
  loadDashboard();
}

init();

// Tab navigation
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => setTab(tab.dataset.tab));
});
</script>
