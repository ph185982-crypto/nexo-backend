<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Vendedor IA · Avanteza</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F5F0E6;
      color: #0B1B33;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #FFFFFF;
      border: 1px solid #EAD9C2;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; }
    p  { color: #55637A; font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
    button {
      background: #FF6A1F;
      color: #0B1B33;
      border: none;
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { background: #FF7A36; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Você está offline</h1>
  <p>Não foi possível conectar ao Vendedor IA. Verifique sua conexão e tente novamente.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
