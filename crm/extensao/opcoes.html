<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Avanteza CRM — WhatsApp</title>
<style>
  body { margin: 0; padding: 18px 20px; width: 340px; font: 14px/1.45 Inter, Arial, sans-serif; background: #F6F5F0; color: #18191D; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
  p { margin: 0 0 12px; color: #686A73; font-size: 12.5px; }
  label { display: block; margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: #686A73; }
  input { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #E6E3DA; border-radius: 10px; background: #fff; font: inherit; }
  button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #2448FF; color: #F6F5F0; font: 700 13px Inter, Arial, sans-serif; cursor: pointer; }
  #msg { margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Avanteza CRM</h1>
  <p>No WhatsApp Web, abra a conversa do cliente e clique em <b>Enviar ao CRM</b>. Role a conversa para cima antes, se quiser mandar mensagens mais antigas.</p>
  <form id="f">
    <label for="url">Endereço do CRM</label>
    <input id="url" type="url" required placeholder="https://nexo-crm-tawny.vercel.app">
    <label for="chave">Chave da extensão</label>
    <input id="chave" type="password" required placeholder="avz_live_…" autocomplete="off">
    <button type="submit">Salvar</button>
  </form>
  <p id="msg" role="status"></p>
  <script src="opcoes.js"></script>
</body>
</html>
